<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>POS Integration Checklist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ─────────────────────────────────────────────────────────────
   Supy design system. Palette, type scale and radii follow the
   brand guidelines. Noto Sans across the board, SF Mono for
   numbers and identifiers.
   ───────────────────────────────────────────────────────────── */
:root{
  /* primary */
  --navy:#321e57; --purple:#503390; --bright:#7b51bf; --action:#6C3FC5; --purple-dark:#4A2A8A;
  /* secondary + tertiary */
  --yellow:#fcd34d; --blue:#109ae7; --orange:#fb763c; --red:#c2260c; --green:#40c798;
  /* semantic badges */
  --bg-success:#E8FAF0; --tx-success:#1A8A5C;
  --bg-warning:#FEF9EC; --tx-warning:#B8860B;
  --bg-error:#FEE2E2;   --tx-error:#DC2626;
  --bg-info:#EBF3FC;    --tx-info:#1E5FA8;
  --bg-neutral:#EDE9FB; --tx-neutral:#6C3FC5;
  --bg-orange:#FFF1E8;  --tx-orange:#C2560F;
  /* neutrals */
  --text:#1A1A2E; --border:#efedfa; --page:#f4f1fa; --card:#ffffff;
  --mid:#888888; --light:#F6F5FA; --lavender:#D0B4FF;
  /* type */
  --font:'Noto Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'SF Mono','Fira Code',ui-monospace,monospace;
  /* elevation */
  --sh-card:0 1px 3px rgba(0,0,0,.06);
  --sh-modal:0 2px 8px rgba(0,0,0,.08);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--page)}
body{font-family:var(--font);font-weight:400;font-size:14px;color:var(--text);
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
#supy-app{font-family:var(--font);color:var(--text);background:var(--page);padding:20px;line-height:1.5;
  max-width:1440px;margin:0 auto}
#supy-app h1,#supy-app h2,#supy-app h3,#supy-app h4,#supy-app p{margin:0}

/* ---------- Header + nav ---------- */
.hd{background:var(--navy);border-radius:12px;padding:22px 24px;margin-bottom:16px}
.hd-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.hd h1{color:#fff;font-size:26px;font-weight:600;letter-spacing:-.015em;line-height:1.2}
.hd p{color:#C9BEE0;font-size:12px;font-weight:400;margin-top:6px}
.nav{display:flex;gap:6px;flex-shrink:0}
.nav-tab{font-family:var(--font);font-size:13px;font-weight:600;padding:9px 16px;border-radius:8px;
  border:1.5px solid rgba(255,255,255,.2);background:transparent;color:#C9BEE0;cursor:pointer;white-space:nowrap;
  transition:background .2s ease-out,color .2s ease-out}
.nav-tab:hover{background:rgba(255,255,255,.1);color:#fff}
.nav-tab.on{background:#fff;color:var(--navy);border-color:#fff}
.nav-tab:disabled{opacity:.4;cursor:not-allowed}

/* ---------- Setup bar ---------- */
.setup{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:16px;
  box-shadow:var(--sh-card)}
.setup-grid{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}
.fld{display:flex;flex-direction:column;gap:5px;flex:1;min-width:190px}
.fld label{font-size:11px;font-weight:600;color:var(--mid);text-transform:uppercase;letter-spacing:.06em}
.fld input,.fld select,.fld textarea{font-family:var(--font);font-size:14px;font-weight:400;padding:10px 12px;
  border:1.5px solid var(--border);border-radius:8px;background:#fff;color:var(--text);outline:none;width:100%}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--action)}
.fld select{cursor:pointer}
.setup-hint{font-size:11.5px;color:var(--mid);margin-top:11px}

/* ---------- Auth bar ---------- */
.authbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--bg-neutral);
  border:1px solid #DDD3F5;border-radius:8px;padding:9px 14px;margin-bottom:14px;font-size:12.5px;font-weight:400}
.authbar input{font-family:var(--font);font-size:12.5px;font-weight:400;padding:7px 10px;
  border:1.5px solid var(--border);border-radius:6px;background:#fff;color:var(--text);outline:none;min-width:200px}
.authbar input:focus{border-color:var(--action)}
.authbar-off{color:var(--mid)}
.authbar-on{font-weight:600;color:var(--tx-neutral)}
.authbar-msg{color:var(--tx-neutral);font-weight:600}

.btn{font-family:var(--font);font-size:13px;font-weight:600;padding:10px 16px;border-radius:8px;
  border:1.5px solid transparent;cursor:pointer;white-space:nowrap;transition:background .2s ease-out}
.btn-primary{background:var(--action);color:#fff}
.btn-primary:hover{background:var(--purple-dark)}
.btn-ghost{background:#fff;color:var(--action);border-color:var(--border)}
.btn-ghost:hover{background:var(--bg-neutral)}
.btn-danger{background:#fff;color:var(--tx-error);border-color:#F5C6C6}
.btn-danger:hover{background:var(--bg-error)}
.btn-solid-danger{background:var(--tx-error);color:#fff}
.btn-solid-danger:hover{background:#B01E1E}
.btn-sm{font-size:12px;padding:7px 12px}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* ---------- Client search combo ---------- */
.combo{position:relative}
.combo-list{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#fff;border:1.5px solid var(--border);
  border-radius:8px;box-shadow:var(--sh-modal);z-index:60;max-height:280px;overflow-y:auto;display:none}
.combo-list.open{display:block}
.combo-opt{padding:9px 12px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;
  border-bottom:1px solid var(--border)}
.combo-opt:last-child{border-bottom:none}
.combo-opt:hover,.combo-opt.hi{background:var(--bg-neutral)}
.combo-opt-n{font-size:13.5px;font-weight:600}
.combo-opt-s{font-size:11.5px;font-weight:400;color:var(--mid)}
.combo-opt-p{font-family:var(--mono);font-size:12px;color:var(--tx-neutral);font-weight:600;flex-shrink:0}
.combo-empty{padding:11px 12px;font-size:12.5px;color:var(--mid)}

/* ---------- Two-column layout ---------- */
.layout{display:flex;gap:16px;align-items:flex-start}
.col-main{flex:1;min-width:0}
/* Sticky, but the panel scrolls its own overflow so a tall sidebar never
   traps content off-screen while the page keeps moving. */
.col-side{width:330px;flex:0 0 330px;position:sticky;top:16px;
  max-height:calc(100vh - 32px);overflow-y:auto;overscroll-behavior:contain;
  scrollbar-width:thin;padding-right:2px}
.col-side::-webkit-scrollbar{width:7px}
.col-side::-webkit-scrollbar-thumb{background:#DDD3F5;border-radius:20px}
.col-side::-webkit-scrollbar-track{background:transparent}

/* ---------- Sidebar ---------- */
.side-card{background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:12px;
  overflow:hidden;box-shadow:var(--sh-card)}
.side-hd{background:var(--navy);padding:12px 16px}
.side-hd h3{color:#fff;font-size:14px;font-weight:600}
.side-hd .side-sub{color:#C9BEE0;font-size:11.5px;font-weight:400;margin-top:3px}
.side-body{padding:14px 16px}
.side-cred{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);align-items:flex-start}
.side-cred:last-child{border-bottom:none}
.side-cred-b{flex:1;min-width:0}
.side-cred-n{font-size:12.5px;font-weight:600;line-height:1.35}
.side-cred.on .side-cred-n{color:var(--mid);text-decoration:line-through}
.side-cred-i{font-size:11.5px;font-weight:400;color:#666;margin-top:3px}
.side-cred-ex{font-family:var(--mono);font-size:11px;color:var(--tx-neutral);background:var(--bg-neutral);
  border-radius:4px;padding:2px 6px;margin-top:4px;display:inline-block;word-break:break-all}
.side-lim{font-size:12px;color:var(--tx-warning);background:var(--bg-warning);border-radius:6px;
  padding:8px 10px;margin-bottom:7px;line-height:1.45}
.side-lim:last-child{margin-bottom:0}
.side-none{font-size:12px;font-weight:400;color:#555;line-height:1.5}
.side-none b{color:var(--text)}
.side-fld label{font-size:11px;font-weight:600;color:var(--mid);text-transform:uppercase;letter-spacing:.06em;
  display:block;margin-bottom:5px}
.side-fld input,.side-fld textarea{font-family:var(--font);font-size:13px;font-weight:400;padding:9px 10px;
  border:1.5px solid var(--border);border-radius:8px;background:#fff;color:var(--text);outline:none;width:100%;resize:vertical}
.side-fld input:focus,.side-fld textarea:focus{border-color:var(--action)}
.side-fld .hint{font-size:11px;color:var(--mid);margin-top:5px;line-height:1.45}
.side-fld .hint b{color:var(--text);font-weight:600}
.side-tag{display:inline-block;font-size:10px;font-weight:700;padding:3px 9px;border-radius:4px;
  text-transform:uppercase;letter-spacing:.05em}
.side-row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--border);
  font-size:12px;align-items:baseline}
.side-row:last-child{border-bottom:none}
.side-row .k{color:var(--mid);font-weight:600;flex-shrink:0}
.side-row .v{text-align:right;font-weight:400}
.link-btn{background:none;border:none;padding:0;font-family:var(--font);font-size:11.5px;font-weight:600;
  color:var(--action);cursor:pointer;text-decoration:underline}
.link-btn:hover{color:var(--purple-dark)}

/* ---------- Progress ---------- */
.prog-wrap{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:16px;
  box-shadow:var(--sh-card)}
.prog-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;flex-wrap:wrap;gap:8px}
.prog-title{font-size:20px;font-weight:600;letter-spacing:-.01em}
.prog-title .sub{color:var(--mid);font-weight:400;font-size:14px}
.prog-num{font-family:var(--mono);font-size:13px;color:var(--mid)}
.bar{height:9px;background:var(--border);border-radius:20px;overflow:hidden}
.bar-fill{height:100%;background:var(--action);border-radius:20px;transition:width .28s ease-out}
.bar-fill.done{background:var(--green)}
.gate-warn{margin-top:12px;background:var(--bg-warning);border-left:3px solid var(--yellow);
  padding:10px 12px;border-radius:0 6px 6px 0;font-size:12.5px;color:var(--tx-warning)}
.gate-ok{margin-top:12px;background:var(--bg-success);border-left:3px solid var(--green);
  padding:10px 12px;border-radius:0 6px 6px 0;font-size:12.5px;color:var(--tx-success);font-weight:600}

/* ---------- Phase ---------- */
.phase{background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:12px;overflow:hidden;
  box-shadow:var(--sh-card)}
.phase-hd{background:var(--purple);padding:13px 18px;display:flex;align-items:center;gap:12px;cursor:pointer;user-select:none}
.phase-hd:hover{background:var(--purple-dark)}
.phase-n{background:rgba(255,255,255,.18);color:#fff;font-family:var(--mono);font-size:11px;font-weight:700;
  width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.phase-t{color:#fff;font-size:15px;font-weight:600;flex:1}
.phase-t .gate{background:var(--yellow);color:var(--navy);font-size:9.5px;font-weight:700;padding:2px 7px;
  border-radius:4px;margin-left:9px;text-transform:uppercase;letter-spacing:.05em;vertical-align:middle}
.phase-c{font-family:var(--mono);font-size:11.5px;color:#D9CFF0;flex-shrink:0}
.phase-ar{color:#fff;font-size:11px;opacity:.75;transition:transform .2s ease-out;flex-shrink:0}
.phase.closed .phase-ar{transform:rotate(-90deg)}
.phase.closed .phase-body{display:none}
.phase.complete .phase-hd{background:var(--tx-success)}
.phase.complete .phase-hd:hover{background:#157049}

/* ---------- Items ---------- */
.item{display:flex;gap:13px;padding:14px 18px;border-bottom:1px solid var(--border);align-items:flex-start}
.item:last-child{border-bottom:none}
.item:hover{background:var(--light)}
.item.checked{background:#FAFCFB}
.item.checked .item-req{text-decoration:line-through;color:var(--mid)}

.cb{width:20px;height:20px;border:2px solid #C9BEE0;border-radius:5px;cursor:pointer;flex-shrink:0;
  margin-top:1px;display:flex;align-items:center;justify-content:center;background:#fff;transition:all .12s ease-out}
.cb:hover{border-color:var(--action)}
.cb.on{background:var(--green);border-color:var(--green)}
.cb.on::after{content:'';width:5px;height:9px;border:solid #fff;border-width:0 2.5px 2.5px 0;
  transform:rotate(45deg);margin-top:-2px}
.cb.sm{width:17px;height:17px;border-radius:4px}
.cb.sm.on::after{width:4px;height:8px;border-width:0 2px 2px 0}

.item-body{flex:1;min-width:0}
.item-req{font-size:13.5px;font-weight:600;margin-bottom:3px}
.item-req .cred{font-family:var(--mono);background:var(--bg-neutral);color:var(--tx-neutral);
  padding:1px 6px;border-radius:4px;font-size:12px;font-weight:600}
.item-ins{font-size:12.5px;font-weight:400;color:#555;margin-bottom:5px}
.item-ex{font-family:var(--mono);font-size:11.5px;color:var(--tx-neutral);background:var(--bg-neutral);
  border-radius:4px;padding:3px 8px;display:inline-block;margin-top:2px;word-break:break-word}
.item-note{font-size:12px;background:var(--bg-warning);color:var(--tx-warning);border-radius:6px;
  padding:7px 10px;margin-top:6px;display:flex;gap:7px;align-items:flex-start}
.item-note::before{content:'!';font-weight:700;flex-shrink:0;font-family:var(--mono)}
.item-note.info{background:var(--bg-info);color:var(--tx-info)}
.item-note.info::before{content:'i'}

.item-meta{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:7px}
.done-at{font-size:11.5px;color:var(--tx-success);font-weight:600}
.note-btn{background:none;border:none;padding:0;font-family:var(--font);font-size:11.5px;font-weight:600;
  color:var(--action);cursor:pointer;text-decoration:underline}
.note-btn:hover{color:var(--purple-dark)}
.note-box{margin-top:8px}
.note-box textarea{font-family:var(--font);font-size:12.5px;font-weight:400;padding:9px 11px;
  border:1.5px solid #DDD3F5;border-radius:8px;background:#fff;color:var(--text);outline:none;width:100%;
  min-height:64px;resize:vertical}
.note-box textarea:focus{border-color:var(--action)}
.note-saved{font-size:12.5px;background:var(--bg-neutral);color:#4A3A6E;border-left:3px solid var(--action);
  border-radius:0 6px 6px 0;padding:7px 11px;margin-top:7px;white-space:pre-wrap;word-break:break-word}

/* complexity picker, inline on the rating item */
.cx-pick{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px;align-items:center}
.cx-lbl{font-size:11px;font-weight:600;color:var(--mid);text-transform:uppercase;letter-spacing:.06em;margin-right:2px}
.cx-chip{display:flex;align-items:center;gap:7px;background:#fff;border:1.5px solid var(--border);border-radius:8px;
  padding:6px 11px;font-size:12.5px;font-weight:600;color:var(--text);cursor:pointer;transition:all .15s ease-out}
.cx-chip:hover{border-color:var(--action);background:var(--light)}
.cx-chip .dot{width:13px;height:13px;border-radius:50%;border:2px solid #C9BEE0;flex-shrink:0}
.cx-chip.on{border-color:var(--action);background:var(--bg-neutral);color:var(--tx-neutral)}
.cx-chip.on .dot{border-color:var(--action);background:var(--action);box-shadow:inset 0 0 0 2.5px #fff}
.cx-chip .days{font-family:var(--mono);font-size:10.5px;font-weight:400;color:var(--mid)}
.cx-chip.on .days{color:var(--tx-neutral)}

.owner{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px;
  text-transform:uppercase;letter-spacing:.04em;margin-left:8px;vertical-align:middle}
.ow-client{background:var(--bg-info);color:var(--tx-info)}
.ow-me{background:var(--bg-neutral);color:var(--tx-neutral)}
.ow-csm{background:var(--bg-warning);color:var(--tx-warning)}
.ow-eng{background:var(--bg-error);color:var(--tx-error)}

/* ---------- Provider brief ---------- */
.pbanner{background:linear-gradient(135deg,#1A0B3D,#503390);border-radius:12px;padding:18px 20px;margin-bottom:16px}
.pbanner-t{color:#fff;font-size:20px;font-weight:600;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  letter-spacing:-.01em}
.pbanner-tag{font-size:10px;font-weight:700;padding:3px 9px;border-radius:4px;text-transform:uppercase;letter-spacing:.05em}
.tag-self{background:var(--bg-success);color:var(--tx-success)}
.tag-assist{background:var(--bg-warning);color:var(--tx-warning)}
.tag-tech{background:var(--bg-error);color:var(--tx-error)}
.pbanner-n{color:var(--lavender);font-size:12.5px;font-weight:400;margin-top:9px;line-height:1.55}
.pbanner-first{margin-top:12px;background:rgba(252,211,77,.14);border-left:3px solid var(--yellow);
  border-radius:0 6px 6px 0;padding:9px 12px}
.pbanner-first .eyebrow{color:var(--yellow);font-size:9.5px;font-weight:700;text-transform:uppercase;
  letter-spacing:.1em;display:block;margin-bottom:3px}
.pbanner-first .txt{color:#fff;font-size:12.5px;font-weight:400;line-height:1.5}
.pfacts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin-top:14px}
.pfact{background:rgba(26,11,61,.42);border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:10px 12px}
.pfact .k{color:#C9BEE0;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;display:block}
.pfact .v{color:#fff;font-size:12.5px;font-weight:400;margin-top:4px;line-height:1.4}
.pfact .v.warn{color:var(--yellow)}
.pbanner-recon{margin-top:12px;padding-top:11px;border-top:1px solid rgba(255,255,255,.15);
  color:#C9BEE0;font-size:11.5px;font-family:var(--mono);line-height:1.55}

/* ---------- Empty ---------- */
.empty{background:var(--card);border:2px dashed var(--border);border-radius:12px;padding:48px 24px;text-align:center}
.empty h3{font-size:16px;font-weight:600;margin-bottom:6px}
.empty p{font-size:13px;font-weight:400;color:var(--mid);max-width:520px;margin:0 auto}

.toolbar{display:flex;gap:8px;justify-content:flex-end;margin-bottom:14px;flex-wrap:wrap}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;
  padding:11px 20px;border-radius:8px;font-size:13px;font-weight:600;z-index:999;opacity:0;
  transition:opacity .2s ease-in-out;pointer-events:none;box-shadow:var(--sh-modal)}
.toast.show{opacity:1}

/* ---------- Health tracker ---------- */
.hcards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.hcard{background:var(--card);border:1px solid var(--border);border-left:4px solid var(--mid);border-radius:12px;
  padding:16px 18px;cursor:pointer;transition:box-shadow .2s ease-out,transform .2s ease-out;box-shadow:var(--sh-card)}
.hcard:hover{box-shadow:0 6px 18px rgba(50,30,87,.1);transform:translateY(-1px)}
.hcard.on{box-shadow:0 0 0 2px var(--action)}
.hcard-n{font-family:var(--mono);font-size:28px;font-weight:700;line-height:1.1}
.hcard-t{font-size:12.5px;font-weight:700;margin-top:4px}
.hcard-d{font-size:11px;font-weight:400;color:var(--mid);margin-top:5px;line-height:1.45}
.hcard.critical{border-left-color:var(--tx-error)} .hcard.critical .hcard-n,.hcard.critical .hcard-t{color:var(--tx-error)}
.hcard.attention{border-left-color:var(--orange)} .hcard.attention .hcard-n,.hcard.attention .hcard-t{color:var(--tx-orange)}
.hcard.ok{border-left-color:var(--green)} .hcard.ok .hcard-n,.hcard.ok .hcard-t{color:var(--tx-success)}
.hcard.complete{border-left-color:var(--action)} .hcard.complete .hcard-n,.hcard.complete .hcard-t{color:var(--tx-neutral)}

.tbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.tbar input{font-family:var(--font);font-size:14px;font-weight:400;padding:10px 12px;border:1.5px solid var(--border);
  border-radius:8px;background:#fff;outline:none;flex:1;min-width:220px}
.tbar input:focus{border-color:var(--action)}
.tbar .filter-note{font-size:12.5px;color:var(--mid)}

.tbl-wrap{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow-x:auto;box-shadow:var(--sh-card)}
table.tbl{width:100%;border-collapse:collapse;min-width:920px}
table.tbl th{background:var(--purple);font-size:11px;font-weight:600;color:#fff;
  text-align:left;padding:12px 14px;cursor:pointer;white-space:nowrap;letter-spacing:.02em}
table.tbl th:first-child{border-radius:11px 0 0 0}
table.tbl th:last-child{border-radius:0 11px 0 0;cursor:default}
table.tbl th:hover{background:var(--purple-dark)}
table.tbl th:last-child:hover{background:var(--purple)}
table.tbl th .ar{opacity:.65;font-size:9px;margin-left:4px}
table.tbl td{padding:12px 14px;border-bottom:1px solid var(--border);font-size:13px;font-weight:400;vertical-align:middle}
table.tbl tr:last-child td{border-bottom:none}
table.tbl tbody tr{cursor:pointer}
table.tbl tbody tr:hover{background:var(--light)}
.td-client{font-weight:600}
.td-pos{color:#555;font-size:12.5px}
.mini-bar{height:6px;background:var(--border);border-radius:20px;overflow:hidden;width:78px;margin-top:5px}
.mini-fill{height:100%;border-radius:20px}
.td-pct{font-family:var(--mono);font-size:12.5px;font-weight:600}
.hbadge{display:inline-block;font-size:10px;font-weight:700;padding:3px 9px;border-radius:4px;
  text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.hb-critical{background:var(--bg-error);color:var(--tx-error)}
.hb-attention{background:var(--bg-orange);color:var(--tx-orange)}
.hb-ok{background:var(--bg-success);color:var(--tx-success)}
.hb-complete{background:var(--bg-neutral);color:var(--tx-neutral)}
.td-dim{color:var(--mid);font-size:12.5px}
.td-late{color:var(--tx-error);font-weight:600;font-size:12.5px}
.row-del{background:none;border:1.5px solid var(--border);color:var(--mid);border-radius:6px;width:26px;height:26px;
  font-size:14px;line-height:1;cursor:pointer;font-family:var(--font);padding:0}
.row-del:hover{border-color:#F5C6C6;background:var(--bg-error);color:var(--tx-error)}

/* ---------- Health sheet ---------- */
.hs-hd{background:linear-gradient(135deg,#1A0B3D,#503390);border-radius:12px;padding:20px;margin-bottom:16px}
.hs-hd h2{color:#fff;font-size:20px;font-weight:600;letter-spacing:-.01em}
.hs-hd .eyebrow{color:var(--yellow);font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;
  display:block;margin-bottom:6px}
.hs-hd .hs-sub{color:var(--lavender);font-size:12.5px;font-weight:400;margin-top:6px;line-height:1.55}
.hs-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:16px}
.hs-mcell{background:rgba(26,11,61,.42);border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:10px 12px}
.hs-mcell .k{color:#C9BEE0;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;display:block}
.hs-mcell .v{color:#fff;font-size:14px;font-weight:600;margin-top:4px}
.hs-mcell .v.mono{font-family:var(--mono);font-size:13px}

.hs-card{background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:12px;
  overflow:hidden;box-shadow:var(--sh-card)}
.hs-card-hd{background:var(--purple);padding:12px 18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hs-card-hd h3{color:#fff;font-size:16px;font-weight:600;flex:1}
.hs-card-hd .hint{color:#D9CFF0;font-size:11.5px;font-weight:400;width:100%;line-height:1.5}
.hs-body{padding:18px}
.hs-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.hs-f label{font-size:11px;font-weight:600;color:var(--mid);text-transform:uppercase;letter-spacing:.06em;
  display:block;margin-bottom:5px}
.hs-f input,.hs-f select,.hs-f textarea{font-family:var(--font);font-size:13.5px;font-weight:400;padding:9px 11px;
  border:1.5px solid var(--border);border-radius:8px;background:#fff;color:var(--text);outline:none;width:100%;resize:vertical}
.hs-f input:focus,.hs-f select:focus,.hs-f textarea:focus{border-color:var(--action)}
.hs-f select{cursor:pointer}
.hs-f .sub{font-size:11px;color:var(--mid);margin-top:5px;line-height:1.45}
.hs-f.wide{grid-column:1 / -1}

.hs-gate{display:flex;gap:12px;align-items:flex-start;padding:13px 0;border-bottom:1px solid var(--border)}
.hs-gate:last-child{border-bottom:none}
.hs-gate-b{flex:1;min-width:0}
.hs-gate-t{font-size:13.5px;font-weight:600}
.hs-gate-s{font-size:11.5px;color:var(--mid);margin-top:3px}
.hs-gate textarea{margin-top:8px;min-height:46px;font-family:var(--font);font-size:13.5px;font-weight:400;
  padding:9px 11px;border:1.5px solid var(--border);border-radius:8px;background:#fff;color:var(--text);
  outline:none;width:100%;resize:vertical;box-sizing:border-box}
.hs-gate textarea:focus{border-color:var(--action)}
.hs-gate-s{margin-bottom:0}
.hs-hl{background:var(--bg-info);border-left:3px solid var(--action);border-radius:0 8px 8px 0;
  padding:10px 12px;margin-bottom:10px;font-size:12.5px;color:var(--tx-info);line-height:1.5}
.hs-hl b{color:var(--text)}
.hs-hl-tag{display:inline-block;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;
  color:var(--mid);margin-bottom:3px}
.hcard-steps{margin:8px 0 0;padding-left:15px;font-size:10.5px;color:var(--mid);line-height:1.55}
.hcard-steps li{margin-bottom:1px}
.gbadge{display:inline-block;font-size:10px;font-weight:700;padding:3px 9px;border-radius:4px;
  text-transform:uppercase;letter-spacing:.04em;flex-shrink:0;white-space:nowrap}
.gb-pass{background:var(--bg-success);color:var(--tx-success)}
.gb-open{background:var(--bg-warning);color:var(--tx-warning)}

table.hs-tbl{width:100%;border-collapse:collapse;min-width:620px}
table.hs-tbl th{background:var(--light);font-size:10.5px;font-weight:700;color:var(--mid);text-transform:uppercase;
  letter-spacing:.06em;text-align:left;padding:9px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
table.hs-tbl td{padding:7px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
table.hs-tbl tr:last-child td{border-bottom:none}
table.hs-tbl input,table.hs-tbl select{font-family:var(--font);font-size:12.5px;font-weight:400;padding:7px 9px;
  border:1.5px solid var(--border);border-radius:6px;background:#fff;color:var(--text);outline:none;width:100%}
table.hs-tbl input:focus,table.hs-tbl select:focus{border-color:var(--action)}
table.hs-tbl input.num{font-family:var(--mono);text-align:right}
.var-out{font-family:var(--mono);font-size:13px;font-weight:700;white-space:nowrap}
.var-out.pass{color:var(--tx-success)}
.var-out.fail{color:var(--tx-error)}
.var-out.none{color:var(--mid);font-weight:400}
.hs-scroll{overflow-x:auto}
.hs-addrow{margin-top:12px}
.hs-emptyrow{font-size:12.5px;color:var(--mid);padding:14px 2px;line-height:1.5}

/* ---------- Modal ---------- */
.mask{position:fixed;inset:0;background:rgba(26,11,61,.5);z-index:900;display:none;align-items:center;
  justify-content:center;padding:20px}
.mask.open{display:flex}
.modal{background:#fff;border-radius:12px;padding:24px;max-width:460px;width:100%;box-shadow:0 20px 50px rgba(26,11,61,.3)}
.modal h3{font-size:20px;font-weight:600;margin-bottom:9px;letter-spacing:-.01em}
.modal p{font-size:13.5px;font-weight:400;color:#555;line-height:1.55}
.modal-sum{background:var(--light);border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-top:14px}
.modal-sum .r{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:4px 0}
.modal-sum .r .k{color:var(--mid);font-weight:600}
.modal-sum .r .v{font-weight:600;text-align:right}
.modal-btns{display:flex;gap:9px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}

/* ---------- Responsive ---------- */
@media (max-width:900px){
  #supy-app{padding:14px}
  .layout{flex-direction:column}
  .col-side{width:100%;flex:1 1 auto;position:static;order:2;max-height:none;overflow:visible}
  .col-main{order:1;width:100%}
  .hcards{grid-template-columns:repeat(2,1fr)}
  .hd-top{flex-direction:column}
  .nav{width:100%}
  .nav-tab{flex:1;text-align:center;padding:9px 8px}
  .pfacts,.hs-meta{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:600px){
  #supy-app{padding:10px}
  .hd{padding:16px}
  .hd h1{font-size:20px}
  .setup{padding:14px}
  .fld{flex:1 1 100%;min-width:0}
  .setup-grid .fld[data-btn]{width:100%}
  .setup-grid .fld[data-btn] .btn{width:100%}
  .hcards{grid-template-columns:1fr}
  .pfacts,.hs-meta,.hs-grid{grid-template-columns:1fr}
  .item{padding:12px 13px;gap:10px}
  .phase-hd{padding:11px 13px;gap:9px}
  .phase-t{font-size:14px}
  .item-req{font-size:13px}
  .item-ins{font-size:12px}
  .prog-wrap,.pbanner,.hs-body,.hs-hd{padding:14px}
  .prog-title{font-size:17px}
  .pbanner-t{font-size:17px}
  .toolbar{justify-content:stretch}
  .toolbar .btn{flex:1 1 auto}
  .modal{padding:18px}
}

/* ---------- Print ---------- */
@media print{
  @page{margin:14mm}
  html,body{background:#fff}
  #supy-app{background:#fff;padding:0;max-width:none}
  .nav,.setup,.authbar,.toolbar,.col-side,.toast,.mask,.note-btn,.cx-chip:not(.on),
  .row-del,.tbar,.hs-addrow,.link-btn{display:none !important}
  .layout{display:block}
  .col-main{width:100%}
  .hd{background:#fff;border:0;border-bottom:1px solid #ccc;padding:0 0 10px 0;margin-bottom:12px}
  .hd h1{color:#000;font-size:19px}
  .hd p{color:#555}
  .phase{break-inside:auto;page-break-inside:auto;border:1px solid #ccc;margin-bottom:10px;box-shadow:none}
  .phase.closed .phase-body{display:block !important}
  .phase-ar{display:none}
  .phase-hd{background:#503390 !important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .phase.complete .phase-hd{background:#1A8A5C !important}
  .item{break-inside:avoid;page-break-inside:avoid}
  .item:hover{background:transparent}
  .cb{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .cb.on{background:#40c798 !important;border-color:#40c798 !important}
  .pbanner,.hs-hd{background:#f4f1fa !important;-webkit-print-color-adjust:exact;print-color-adjust:exact;
    border:1px solid #ccc}
  .pbanner-t,.hs-hd h2{color:#321e57}
  .pbanner-n,.hs-hd .hs-sub{color:#4A3A6E}
  .pbanner-recon,.pbanner-first .txt{color:#333}
  .pbanner-first .eyebrow,.hs-hd .eyebrow{color:#B8860B}
  .pfact,.hs-mcell{background:#fff !important;border:1px solid #ddd}
  .pfact .k,.hs-mcell .k{color:#666}
  .pfact .v,.hs-mcell .v{color:#1A1A2E}
  .item-note,.note-saved,.item-ex,.hbadge,.gbadge,.side-lim{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .hs-card{break-inside:avoid;page-break-inside:avoid;border:1px solid #ccc;box-shadow:none}
  .hs-card-hd{background:#503390 !important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .hs-f input,.hs-f select,.hs-f textarea,table.hs-tbl input,table.hs-tbl select{border-color:#ccc}
  .tbl-wrap{overflow:visible;box-shadow:none}
  table.tbl{min-width:0}
  table.tbl th{background:#503390 !important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  table.tbl th:last-child,table.tbl td:last-child{display:none}
}

/* ═════════════════════════════════════════════════════════════════════
   COMPLEXITY RATING
   The rating exists to change the timeline, so each level carries the
   number of days it adds. Charter baseline is go-live at the end of
   week 2, which is the 14 days on Simple. Standard and Complex add the
   buffer the rating is supposed to buy.
   ═════════════════════════════════════════════════════════════════════ */
var CX = [
  {k:"Simple",   days:14, d:"1 to 3 branches, light modifier use, one brand"},
  {k:"Standard", days:21, d:"4 to 10 branches, moderate modifiers, or a second pillar in scope"},
  {k:"Complex",  days:30, d:"11+ branches, heavy modifiers, multi-brand, or engineering-handled POS"}
];
function cxDays(name){
  for(var i=0;i<CX.length;i++) if(CX[i].k === name) return CX[i].days;
  return CX[0].days;
}

/* ═════════════════════════════════════════════════════════════════════
   LIFECYCLE PHASES
   Every item carries a stable `id`. Progress is stored against that id,
   never against an array position, so reordering or inserting items
   later does not scramble anyone's saved checklist.
   owner: me | client | csm | eng
   ═════════════════════════════════════════════════════════════════════ */
function buildPhases(posName){
  var p = P[posName];

  var credItems = p.creds.map(function(c,i){
    var handledBySupy = p.type === "tech" ||
      /CSM|Integrations team|Supy team|Supy does|Supy completes/.test(c.i || "");
    return {
      id:"cred-"+i,
      r:"<span class='cred'>"+esc(c.r)+"</span>",
      plain:c.r,
      i:c.i,
      ex:c.ex || "",
      n:c.n || "",
      nt:c.nt || "",
      o: handledBySupy ? "csm" : "client"
    };
  });

  return [
  {n:"0", t:"Kickoff and complexity rating", gate:"48h", items:[
    {id:"k-review",r:"Reviewed this implementation within 48 hours of kickoff",
      i:"A charter requirement. Every new implementation gets your eyes on it inside two days. No exceptions."},
    {id:"k-pos",r:"Confirmed the exact POS product, not just the brand name",
      i:"Right now this is set to <b>"+esc(posName)+"</b>. Brand names hide real differences. Lightspeed alone has three separate integrations (K-Series, O-Series, X-Series) and they do not behave the same way.",nt:"info"},
    {id:"k-branches",r:"Counted how many branches will connect",
      i:"1 to 3 branches is Simple. 4 to 10 is Standard. 11 or more is Complex.",o:"client"},
    {id:"k-mods",r:"Checked how much the menu relies on modifiers and combos",
      i:"Ask the client straight out. Minimal, moderate (10 to 30% of orders), or heavy (30%+). Example: a burger chain where nearly every order is 'no pickles, extra cheese, make it a meal' is heavy.",
      n:"Modifiers cause more mapping mistakes than anything else on this list. On a heavy-modifier menu, check every mapped item by hand."},
    {id:"k-brands",r:"Checked whether the client runs more than one brand or POS account",
      i:"Each brand or separate POS account becomes its own tenant in Supy. Example: one group running a cafe brand and a burger brand on two Foodics accounts means two tenants, not one.",o:"client"},
    {id:"k-pillars",r:"Listed which other Supy pillars are in scope",

/* ═════════════════════════════════════════════════════════════════════
   PROVIDER BRIEF
   Everything here is derived from the provider data above, so nothing
   is asserted that is not already documented somewhere.
   ═════════════════════════════════════════════════════════════════════ */
function providerBrief(pos){
  var p = P[pos];
  var text = (p.note || "") + " " + (p.limits || []).join(" ");
  /* word boundaries matter: without \b, "nothing" matches "thin" */
  var thin = /\bincomplete\b|\bundocumented\b|not fully documented|no documentation|not documented|\bthin\b|\bminimal\b|\bpartial\b/i.test(text);

  var waiting = p.type === "tech" ? "Supy Engineering, plus the POS provider for credentials"
              : p.type === "assist" ? "The CSM, plus the POS provider for credentials"
              : /popup|logs in|signs into/i.test(p.note) ? "Only the client, they log in themselves"
              : "The POS provider, to issue the credentials";

  var first = /^The order (of steps )?matters|Sequencing matters|The CSM (has to|must)/i.test(p.note)
      ? "Start with the CSM request described below. Nothing else can move until it is done."
    : p.type === "tech"
      ? "Raise the request with the Integrations team and get a committed date before you promise the client anything."
    : /popup|logs in|signs into/i.test(p.note)
      ? "Book time with the client's contact. They sign in themselves, so you cannot do this part without them on the call."
      : "Ask the client to request the " + p.creds.length + " item" + (p.creds.length === 1 ? "" : "s") + " listed in the sidebar from their " + pos + " contact.";

  return {
    type: p.type === "self" ? "Self-service" : p.type === "assist" ? "Assisted setup" : "Engineering-handled",
    auth: p.auth,
    waiting: waiting,
    docs: thin ? "Partial. Confirm current behaviour with the Supy team before you commit to anything" : "Documented",
    docsWarn: thin,
    creds: p.creds.length + " to collect",
    mapping: p.mapping || "Syncs from the POS",
    mappingWarn: !!p.mapping,
    recon: p.recon ? "Report path documented" : "Not documented, ask the Supy team where to pull it",
    reconWarn: !p.recon,
    lead: p.lead || "",
    limits: (p.limits || []).length,
    first: first
  };
}

/* ═════════════════════════════════════════════════════════════════════
   HELPERS
   ═════════════════════════════════════════════════════════════════════ */
var MAX_CLIENTS = 100;
var VARIANCE_KPI = 1;               /* charter: under 1% */

var $ = function(id){return document.getElementById(id);};
var key = function(c,p){return "posck:rec:"+String(c).trim().toLowerCase()+"::"+p;};
function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}
function nowISO(){ return new Date().toISOString(); }
function fmtDate(v){
  if(!v) return "";
  var d = new Date(v);
  if(isNaN(d.getTime())) return "";
  return d.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});
}
function ymd(d){
  var m = String(d.getMonth()+1); if(m.length < 2) m = "0"+m;
  var day = String(d.getDate());  if(day.length < 2) day = "0"+day;
  return d.getFullYear()+"-"+m+"-"+day;
}
function addDays(v, n){
  var d = new Date(v);
  if(isNaN(d.getTime())) return "";
  d.setDate(d.getDate() + n);
  return ymd(d);
}
function daysSince(v){
  if(!v) return 0;
  var d = new Date(v).getTime();
  if(isNaN(d)) return 0;
  return Math.floor((Date.now() - d) / 86400000);
}
function daysUntilTarget(dateStr){
  if(!dateStr) return null;
  var d = new Date(dateStr + "T23:59:59").getTime();
  if(isNaN(d)) return null;
  return Math.ceil((d - Date.now()) / 86400000);
}
function relDays(v){
  if(!v) return "Not recorded";
  var n = daysSince(v);
  if(n <= 0) return "Today";
  if(n === 1) return "Yesterday";
  return n + " days ago";
}
function each(sel, fn){
  Array.prototype.forEach.call(document.querySelectorAll(sel), fn);
}

/* ═════════════════════════════════════════════════════════════════════
   STORAGE
   Everything lives in this browser's localStorage. The functions are
   async on purpose: swapping localStorage for Supabase later means
   rewriting only the three bodies below, nothing else in this file.
   See SUPABASE.md in the repo for the table schema and the adapter.
   ═════════════════════════════════════════════════════════════════════ */
var mem = {};
var DB = {
  get: function(k){
    try{
      var v = localStorage.getItem(k);
      return Promise.resolve(v ? JSON.parse(v) : (mem[k] || null));
    }catch(e){ return Promise.resolve(mem[k] || null); }
  },
  set: function(k,v){
    mem[k] = v;
    try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){}
    return Promise.resolve();
  },
  del: function(k){
    delete mem[k];
    try{ localStorage.removeItem(k); }catch(e){}
    return Promise.resolve();
  }
};

/* ═════════════════════════════════════════════════════════════════════
   CLOUD SYNC (Supabase)
   Optional, layered on top of DB rather than inside it. With the
   placeholders in SUPABASE CONFIG left untouched, every function below
   resolves to null / no-ops, so the page behaves exactly as it did on
   localStorage alone. Fill in the two values to turn this on.

   localStorage stays the source of truth for instant UI feedback:
   a checkbox click never waits on the network. Supabase is written to
   in the background after every save, and read from on open and on
   refresh, so the team sees each other's clients.
   ═════════════════════════════════════════════════════════════════════ */
var Cloud = (function(){
  var session = null;
  var listeners = [];

  function enabled(){ return !!supa; }
  function notify(){ listeners.forEach(function(fn){ fn(session); }); }
  function onChange(fn){ listeners.push(fn); }

  if(enabled()){
    supa.auth.getSession().then(function(res){ session = res.data.session; notify(); });
    supa.auth.onAuthStateChange(function(_event, s){ session = s; notify(); });
  }

  function signIn(email){
    if(!enabled()) return Promise.reject(new Error("Cloud sync is not configured"));
    return supa.auth.signInWithOtp({
      email: email,
      options: { emailRedirectTo: window.location.origin + window.location.pathname }
    });
  }
  function signOut(){
    return enabled() ? supa.auth.signOut() : Promise.resolve();
  }

  /* local record <-> Supabase row. collapsed (which phases are folded)
     stays local only, it is UI state, not something to sync. */
  function toRow(rec){
    var t = totals(buildPhases(rec.pos), rec.items);
    return {
      client_name: rec.client, pos_provider: rec.pos,
      go_live_target: rec.goLiveTarget || null,
      special_note: rec.specialNote || "",
      done_items: t.done, total_items: t.all,
      complexity: rec.complexity || "",
      go_live_manual: !!rec.goLiveManual,
      health_sheet: rec.hs || {},
      created_at: rec.createdAt, updated_at: rec.updatedAt
    };
  }
  function fromRow(row, itemRows){
    var items = {};
    (itemRows || []).forEach(function(r){
      var entry = { done: !!r.done };
      if(r.done_at) entry.doneAt = r.done_at;
      if(r.note) entry.note = r.note;
      if(entry.done || entry.note) items[r.item_id] = entry;
    });
    var hs = (row.health_sheet && Object.keys(row.health_sheet).length) ? row.health_sheet : blankHS();
    return {
      client: row.client_name, pos: row.pos_provider,
      createdAt: row.created_at, updatedAt: row.updated_at,
      complexity: row.complexity || "",
      goLiveTarget: row.go_live_target || "", goLiveManual: !!row.go_live_manual,
      specialNote: row.special_note || "",
      items: items, collapsed: {},
      hs: hs
    };
  }

  function fetchRecord(client, pos){
    if(!enabled()) return Promise.resolve(null);
    /* order + limit(1) rather than .maybeSingle(), so two staff who
       both created "the same" client/POS pairing do not turn into a
       hard error, the most recently touched row just wins */
    return supa.from("checklists").select("*")
      .eq("client_name", client).eq("pos_provider", pos)
      .order("updated_at", { ascending:false }).limit(1)
      .then(function(res){
        var row = res.data && res.data[0];
        if(res.error || !row) return null;
        return supa.from("checklist_items").select("*").eq("checklist_id", row.id)
          .then(function(ir){ return fromRow(row, ir.data || []); });
      })
      .catch(function(){ return null; });
  }

  function fetchIndex(){
    if(!enabled()) return Promise.resolve(null);
    return supa.from("checklists").select("*")
      .order("updated_at", { ascending:false }).limit(200)
      .then(function(res){
        if(res.error || !res.data) return null;
        return res.data.map(function(row){
          return {
            client: row.client_name, pos: row.pos_provider,
            pct: row.total_items ? Math.round(row.done_items / row.total_items * 100) : 0,
            done: row.done_items, all: row.total_items,
            complexity: row.complexity || "",
            createdAt: row.created_at, updatedAt: row.updated_at,
            goLiveTarget: row.go_live_target || ""
          };
        });
      })
      .catch(function(){ return null; });
  }

  /* fire-and-forget: the local save already happened, so a failure
     here (offline, not signed in, RLS denial) never blocks the UI */
  function upsertRecord(rec){
    if(!enabled() || !session) return Promise.resolve();
    var row = toRow(rec);
    return supa.from("checklists").upsert(row, { onConflict: "owner_id,client_name,pos_provider" })
      .select().maybeSingle()
      .then(function(res){
        if(res.error || !res.data) return;
        var checklistId = res.data.id;
        var itemRows = Object.keys(rec.items || {}).map(function(id){
          var it = rec.items[id];
          return {
            checklist_id: checklistId, item_id: id,
            done: !!it.done, done_at: it.doneAt || null,
            note: it.note || "", updated_at: nowISO()
          };
        });
        if(itemRows.length) return supa.from("checklist_items").upsert(itemRows, { onConflict: "checklist_id,item_id" });
      })
      .catch(function(){});
  }

  function deleteRecord(client, pos){
    if(!enabled() || !session) return Promise.resolve();
    return supa.from("checklists").delete()
      .eq("client_name", client).eq("pos_provider", pos)
      .catch(function(){});
  }

  return {
    enabled: enabled,
    session: function(){ return session; },
    onChange: onChange,
    signIn: signIn, signOut: signOut,
    fetchRecord: fetchRecord, fetchIndex: fetchIndex,
    upsertRecord: upsertRecord, deleteRecord: deleteRecord
  };
})();

/* ═════════════════════════════════════════════════════════════════════
   GO-LIVE TARGET
   The target is derived from the day work actually started, which is
   the first item ticked on the checklist, plus the buffer the
   complexity rating carries. Editing the date by hand pins it.
   ═════════════════════════════════════════════════════════════════════ */
function kickoffAnchor(rec){
  rec = rec || cur;
  if(!rec || !rec.items) return "";
  var earliest = "";
  Object.keys(rec.items).forEach(function(k){
    var at = rec.items[k] && rec.items[k].doneAt;
    if(at && (!earliest || at < earliest)) earliest = at;
  });
  return earliest;
}
function defaultTarget(rec){
  rec = rec || cur;
  var anchor = kickoffAnchor(rec);
  if(!anchor) return "";
  return addDays(anchor, cxDays(rec.complexity));
}
function applyDefaultTarget(){
  if(!cur || cur.goLiveManual) return;
  var d = defaultTarget(cur);
  if(d) cur.goLiveTarget = d;
}

/* ═════════════════════════════════════════════════════════════════════
   PROGRESS + HEALTH
   ═════════════════════════════════════════════════════════════════════ */
function totals(phases, items){
  var done = 0, all = 0;
  phases.forEach(function(ph){
    ph.items.forEach(function(it){
      all++;
      if(items && items[it.id] && items[it.id].done) done++;
    });
  });
  return { done:done, all:all, pct: all ? Math.round(done/all*100) : 0 };
}

/* Health thresholds, all in one place so they are easy to tune.
   critical  : past the go-live target, or 7+ days quiet under 80%,
               or 30+ days since kickoff under 70%
   attention : target within 7 days under 70%, or 5+ days quiet under 60%,
               or 21+ days in under 70%, or 14+ days in under 50%
   complete  : every item checked
   ok        : everything else                                          */
function healthOf(row){
  if(row.all > 0 && row.done === row.all) return "complete";
  var pct = row.pct;
  var quiet = daysSince(row.updatedAt || row.createdAt);
  var age = daysSince(row.createdAt);
  var toTarget = daysUntilTarget(row.goLiveTarget);

  if(toTarget !== null && toTarget < 0) return "critical";
  if(quiet >= 7 && pct < 80) return "critical";
  if(age >= 30 && pct < 70) return "critical";

  if(toTarget !== null && toTarget <= 7 && pct < 70) return "attention";
  if(quiet >= 5 && pct < 60) return "attention";
  if(age >= 21 && pct < 70) return "attention";
  if(age >= 14 && pct < 50) return "attention";

  return "ok";
}
var HEALTH_META = {
  critical:{label:"Critical", desc:"Past target date, quiet 7+ days under 80%, or 30+ days in under 70%",
    actions:["Contact the client today, not another automated check-in",
             "Escalate to your manager or CSM with the reason and a recovery date",
             "Log the cause in the Health Sheet friction log"]},
  attention:{label:"Needs attention", desc:"Target close with low progress, quiet 5+ days, or slow since kickoff",
    actions:["Reach out this week and confirm the current blocker and its owner",
             "Sanity-check whether the go-live target is still realistic",
             "Note the risk in the Health Sheet so it is not a surprise later"]},
  ok:{label:"On track", desc:"Moving along inside the expected timeline",
    actions:["Keep the normal cadence, no intervention needed",
             "Confirm the next milestone and who owns it",
             "Watch for the gate coming up next"]},
  complete:{label:"Complete", desc:"Every checklist item done",
    actions:["Confirm the Day 7 and Day 30 audits are logged",
             "Confirm the sign-off block is filled in and dated",
             "Close and archive the Health Sheet"]}
};
function healthReason(row){
  var h = healthOf(row);
  if(h === "complete") return "All items complete";
  var toTarget = daysUntilTarget(row.goLiveTarget);
  var quiet = daysSince(row.updatedAt || row.createdAt);
  var age = daysSince(row.createdAt);
  if(toTarget !== null && toTarget < 0) return Math.abs(toTarget) + " days past go-live target";
  if(quiet >= 7 && row.pct < 80) return "No activity for " + quiet + " days at " + row.pct + "%";
  if(age >= 30 && row.pct < 70) return age + " days since kickoff at " + row.pct + "%";
  if(toTarget !== null && toTarget <= 7 && row.pct < 70) return "Target in " + toTarget + " days at " + row.pct + "%";
  if(quiet >= 5 && row.pct < 60) return "No activity for " + quiet + " days at " + row.pct + "%";
  if(age >= 21 && row.pct < 70) return age + " days since kickoff at " + row.pct + "%";
  if(age >= 14 && row.pct < 50) return age + " days since kickoff at " + row.pct + "%";
  return "On schedule";
}
function barColor(h){
  return h === "critical" ? "var(--tx-error)" :
         h === "attention" ? "var(--orange)" :
         h === "complete" ? "var(--action)" : "var(--green)";
}

/* The four hard gates, by phase index */
var GATES = [
  {i:0, label:"Kickoff reviewed and complexity rated"},
  {i:4, label:"Live data from every location, before UAT"},
  {i:6, label:"Variance under 1% on 3 to 7 days of real sales"},
  {i:8, label:"Go-live sign-off"}
];
function gateStatus(phases, gi){
  var ph = phases[gi];
  var latest = "", open = 0;
  ph.items.forEach(function(it){
    var st = itemState(it.id);
    if(st && st.done){ if(st.doneAt && st.doneAt > latest) latest = st.doneAt; }
    else open++;
  });
  return { passed: open === 0, open: open, total: ph.items.length, at: latest, title: ph.t };
}

/* ═════════════════════════════════════════════════════════════════════
   CHECKLIST WIRING
   ═════════════════════════════════════════════════════════════════════ */
function wireChecklist(phases, p){
  /* one handler covers the checklist and the sidebar, so ticking a
     credential in either place updates the other */
  each("[data-check]", function(el){
    el.onclick = function(){
      var id = el.getAttribute("data-check");
      var st = cur.items[id];
      if(st && st.done){
        st.done = false;
        delete st.doneAt;
        if(!st.note) delete cur.items[id];
      }else{
        cur.items[id] = cur.items[id] || {};
        cur.items[id].done = true;
        cur.items[id].doneAt = nowISO();
      }
      applyDefaultTarget();
      save().then(render);
    };
  });

  each("[data-cx]", function(el){
    el.onclick = function(){
      var k = el.getAttribute("data-cx");
      cur.complexity = (cur.complexity === k) ? "" : k;
      /* picking a rating is the act of assigning it */
      if(cur.complexity && !isDone("k-rating")){
        cur.items["k-rating"] = cur.items["k-rating"] || {};
        cur.items["k-rating"].done = true;
        cur.items["k-rating"].doneAt = nowISO();
      }
      applyDefaultTarget();
      save().then(render);
    };
  });

  each(".phase-hd", function(el){
    el.onclick = function(){
      var pi = el.getAttribute("data-toggle");
      if(cur.collapsed[pi]) delete cur.collapsed[pi];
      else cur.collapsed[pi] = true;
      save().then(render);
    };
  });

  each("[data-note]", function(el){
    el.onclick = function(){
      var id = el.getAttribute("data-note");
      if(openNotes[id]) delete openNotes[id];
      else openNotes[id] = true;
      render();
      var ta = document.querySelector('[data-noteinput="' + id + '"]');
      if(ta){ ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
    };
  });

  /* typing never re-renders, or the caret would jump */
  each("[data-noteinput]", function(el){
    el.oninput = function(){
      var id = el.getAttribute("data-noteinput");
      cur.items[id] = cur.items[id] || {};
      cur.items[id].note = el.value;
      if(!el.value && !cur.items[id].done) delete cur.items[id];
      debounceSave();
    };
  });

  var target = $("sideTarget");
  if(target) target.onchange = function(){
    cur.goLiveTarget = target.value;
    cur.goLiveManual = true;
    save().then(render);
  };
  var tgtAuto = $("tgtAuto");
  if(tgtAuto) tgtAuto.onclick = function(){
    cur.goLiveManual = false;
    applyDefaultTarget();
    save().then(render);
  };

  var sNote = $("sideNote");
  if(sNote){
    sNote.value = cur.specialNote || "";
    sNote.oninput = function(){ cur.specialNote = sNote.value; debounceSave(); };
  }

  $("expandAll").onclick = function(){ cur.collapsed = {}; save().then(render); };
  $("collapseAll").onclick = function(){
    cur.collapsed = {};
    phases.forEach(function(_,i){ cur.collapsed[i] = true; });
    save().then(render);
  };
  $("printBtn").onclick = function(){ window.print(); };
  $("copyBtn").onclick = function(){ copyAsText(phases, p); };
  $("resetBtn").onclick = function(){ askReset(); };
  $("delBtn").onclick = function(){ askDelete(cur.client, cur.pos); };
}

function debounceSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(function(){ save(); }, 600);
}

/* ═════════════════════════════════════════════════════════════════════
   HEALTH SHEET
   One per implementation. Opens at kickoff, closes at Day 30. This is
   where gate evidence, the variance history, the audits, the friction
   log and the sign-off live, so the checklist stays a checklist.
   ═════════════════════════════════════════════════════════════════════ */
function variancePct(pos, supy){
  var a = parseFloat(pos), b = parseFloat(supy);
  if(!isFinite(a) || !isFinite(b) || a === 0) return null;
  return Math.abs(a - b) / Math.abs(a) * 100;
}
function varCell(v){
  if(v.pos === "" || v.supy === "" || v.pos == null || v.supy == null)
    return '<span class="var-out none">Enter both</span>';
  var pct = variancePct(v.pos, v.supy);
  if(pct === null) return '<span class="var-out none">Check numbers</span>';
  var pass = pct < VARIANCE_KPI;
  return '<span class="var-out ' + (pass ? "pass" : "fail") + '">' + pct.toFixed(2) + '% ' +
         (pass ? "pass" : "FAIL") + '</span>';
}

function hsf(type, path, label, opts){
  opts = opts || {};
  var hs = cur.hs;
  var val = hs[path] == null ? "" : hs[path];
  var h = '<div class="hs-f' + (opts.wide ? " wide" : "") + '"><label>' + esc(label) + '</label>';
  if(type === "textarea"){
    h += '<textarea data-hs="' + path + '" rows="' + (opts.rows || 3) + '" placeholder="' +
         esc(opts.ph || "") + '">' + esc(val) + '</textarea>';
  }else if(type === "select"){
    h += '<select data-hs="' + path + '"><option value="">Not set</option>';
    (opts.options || []).forEach(function(o){
      h += '<option value="' + esc(o) + '"' + (val === o ? " selected" : "") + '>' + esc(o) + '</option>';
    });
    h += '</select>';
  }else{
    h += '<input type="' + type + '" data-hs="' + path + '" value="' + esc(val) + '" placeholder="' +
         esc(opts.ph || "") + '"' + (type === "number" ? ' step="any"' : '') + '/>';
  }
  if(opts.sub) h += '<div class="sub">' + opts.sub + '</div>';
  h += '</div>';
  return h;
}

function renderHealth(){
  var wrap = $("healthPage");

  if(!cur){
    wrap.innerHTML = '<div class="empty"><h3>No client open</h3>' +
      '<p>The Health Sheet belongs to one client. Open a checklist first, then come back to this tab.</p></div>';
    return;
  }

  cur.hs = cur.hs || blankHS();
  var hs = cur.hs;
  var p = P[cur.pos];
  var phases = buildPhases(cur.pos);
  var t = totals(phases, cur.items);
  var anchor = kickoffAnchor(cur);
  var row = {pct:t.pct, done:t.done, all:t.all, createdAt:cur.createdAt,
             updatedAt:cur.updatedAt, goLiveTarget:cur.goLiveTarget};
  var hh = healthOf(row);

  var status = t.done === t.all && t.all > 0 ? "Closed"

  var h = "";

       '<button class="btn btn-ghost btn-sm" id="hsCopy">Copy as text</button>' +

       '<button class="btn btn-ghost btn-sm" id="hsToChecklist">Back to checklist</button></div>';

  h += '<div class="hs-sub">Opened at kickoff, closed at Day 30. Everything on this page is evidence: what was ' +
       'checked, what the numbers were, and who decided what. The checklist tracks the work, this sheet is what ' +
       'you sign your name to.</div>';
  h += '<div class="hs-meta">';
  h += hsMeta("Status", status);
  h += hsMeta("Health", HEALTH_META[hh].label);
