  h += hsMeta("Checklist", t.done + " / " + t.all + " (" + t.pct + "%)", true);
  h += hsMeta("Work started", anchor ? fmtDate(anchor) : "Not started");
  h += hsMeta("Go-live target", cur.goLiveTarget ? fmtDate(cur.goLiveTarget) : "Not set");
  h += hsMeta("Actual go-live", hs.actualGoLive ? fmtDate(hs.actualGoLive) : "Not yet");
  h += hsMeta("Days open", anchor ? String(daysSince(anchor)) : "0", true);
  h += '</div></div>';

  /* 1. scope and contact */
  h += hsCard("Scope and contacts", "Captured at kickoff. These are the answers that drove the complexity rating, so write down what you were actually told, not what you assumed.");
  h += '<div class="hs-grid">';
  h += hsf("text","contactName","Client contact name",{ph:"Full name, not a team",
    sub:"The person who actually answers when something breaks, not whoever signed the contract"});
  h += hsf("text","contactEmail","Contact email",{ph:"name@company.com"});
  h += hsf("text","contactPhone","Contact phone",{ph:"+971 50 123 4567",
    sub:"For the day this needs a phone call instead of an email"});
  h += hsf("number","branches","Branch count",{ph:"e.g. 8",
    sub:"Every branch counted here needs live data before the branch mapping gate can pass"});
  h += hsf("number","brands","Brands / tenants",{ph:"e.g. 2",sub:"Each brand or separate POS account is its own tenant"});
  h += hsf("select","modLoad","Modifier and combo load",{options:["Minimal","Moderate (10 to 30%)","Heavy (30%+)"],
    sub:"Heavy load is what usually drives the complexity rating up and stretches the item mapping phase"});
  h += hsf("textarea","pillars","Other pillars in scope",{wide:true,rows:2,
    ph:"Accounting (Xero), supplier connectivity, Open API, Delta Share, MCP. Write N/A where nothing applies.",
    sub:"Anything not listed here is out of scope, and that is the version you will be held to at sign-off."});
  h += '</div>';
  h += hsCardEnd();

  /* 1.5 checklist highlights, pulled from the checklist so this sheet reflects
     this client rather than a blank template */
  var itemNotes = [];
  phases.forEach(function(ph){
    ph.items.forEach(function(it){
      var st = itemState(it.id);
      if(st && st.note && st.note.trim()) itemNotes.push({phase:ph.t, label:it.r, note:st.note.trim(), done:!!st.done});
    });
  });
  h += hsCard("Checklist highlights", "Pulled from the Checklist tab: the special case note and any per-item notes left there, plus what we already know about this POS. Edit the source on the Checklist tab, not here.");
  if(cur.specialNote && cur.specialNote.trim()){
    h += '<div class="hs-hl"><span class="hs-hl-tag">Special case</span><br>' + esc(cur.specialNote.trim()) + '</div>';
  }
  itemNotes.forEach(function(n){
    h += '<div class="hs-hl"><span class="hs-hl-tag">' + esc(n.phase) + (n.done ? "" : " &middot; still open") + '</span><br>' +
         '<b>' + esc(n.label) + ':</b> ' + esc(n.note) + '</div>';
  });
  if(p.limits && p.limits.length){
    h += '<div class="hs-hl"><span class="hs-hl-tag">Known limitations for ' + esc(cur.pos) + ' &middot; provider-wide, not client-specific</span><br>' +
         p.limits.map(esc).join('<br>') + '</div>';
  }
  if(!(cur.specialNote && cur.specialNote.trim()) && !itemNotes.length && !(p.limits && p.limits.length)){
    h += '<div class="hs-emptyrow">Nothing flagged yet. Add a special case note or a per-item note on the Checklist tab and it appears here automatically.</div>';
  }
  h += hsCardEnd();

  /* 2. gate log */
  h += hsCard("Gate log", "Status comes straight from the checklist and cannot be typed over. The note is where the evidence goes: what you checked, what you saw, and anything you accepted with a caveat.");
  GATES.forEach(function(g){
    var st = gateStatus(phases, g.i);
    h += '<div class="hs-gate">';
    h += '<span class="gbadge ' + (st.passed ? "gb-pass" : "gb-open") + '">' + (st.passed ? "Passed" : st.open + " open") + '</span>';
    h += '<div class="hs-gate-b"><div class="hs-gate-t">' + esc(st.title) + '</div>';
    h += '<div class="hs-gate-s">' + esc(g.label) + ' &middot; ' +
         (st.passed ? "cleared " + (st.at ? esc(fmtDate(st.at)) : "date not recorded")
                    : st.open + " of " + st.total + " items outstanding") + '</div>';
    h += '<textarea data-hs="gate' + g.i + '" placeholder="Evidence and anything you accepted with a caveat. Example: variance 0.73% on 5 days across all 8 branches, residual is service charge."></textarea>';
    h += '</div></div>';
  });
  h += hsCardEnd();

  /* 3. variance log */
  h += hsCard("Variance log", "The 1% KPI is a trend, not a single reading. Add a row for the pre-go-live check, one at Day 7, and one per week up to Day 30. The percentage calculates itself.");
  h += '<div class="hs-scroll"><table class="hs-tbl"><thead><tr>' +
       '<th style="width:120px">From</th><th style="width:120px">To</th>' +
       '<th style="width:130px">POS total</th><th style="width:130px">Supy total</th>' +
       '<th style="width:120px">Variance</th><th>Cause or note</th><th style="width:44px"></th>' +
       '</tr></thead><tbody>';
  if(!hs.variance.length){
    h += '<tr><td colspan="7" class="hs-emptyrow">No entries yet. Add the pre-go-live check first: the 3 to 7 day ' +
         'window you validated the gate with, and the numbers you compared.</td></tr>';
  }
  hs.variance.forEach(function(v,i){
    h += '<tr>';
    h += '<td><input type="date" data-hsr="variance|' + i + '|from" value="' + esc(v.from || "") + '"/></td>';
    h += '<td><input type="date" data-hsr="variance|' + i + '|to" value="' + esc(v.to || "") + '"/></td>';
    h += '<td><input type="number" step="any" class="num" data-hsr="variance|' + i + '|pos" value="' + esc(v.pos || "") + '" placeholder="482600"/></td>';
    h += '<td><input type="number" step="any" class="num" data-hsr="variance|' + i + '|supy" value="' + esc(v.supy || "") + '" placeholder="479100"/></td>';
    h += '<td data-varout="' + i + '">' + varCell(v) + '</td>';
    h += '<td><input type="text" data-hsr="variance|' + i + '|cause" value="' + esc(v.cause || "") + '" placeholder="Service charge excluded by design"/></td>';
    h += '<td><button class="row-del" data-hsdel="variance|' + i + '" title="Remove row">&times;</button></td>';
    h += '</tr>';
  });
  h += '</tbody></table></div>';
  h += '<div class="hs-addrow"><button class="btn btn-ghost btn-sm" data-hsadd="variance">+ Add variance entry</button></div>';
  h += hsCardEnd();

  /* 4. audits */
  h += hsCard("Day 7 and Day 30 audits", "The checklist has the item-by-item audit. This is the summary you would hand someone who asks what state the integration is in.");
  h += '<div class="hs-grid">';
  h += hsf("date","d7date","Day 7 audit completed",{sub:"Rerun the reconciliation on the last 3 days, do not reuse the pre-go-live window"});
  h += hsf("date","d30date","Day 30 audit completed",{sub:"This date is what closes the Health Sheet"});
  h += hsf("textarea","d7notes","Day 7 findings",{wide:true,rows:3,
    ph:"What you found, and who owns each open item with a date. Example: branch 4 stopped syncing on day 3, CSM re-authenticated Aug 18, backfilled."});
  h += hsf("textarea","d30notes","Day 30 findings",{wide:true,rows:3,
    ph:"Variance trend across the four weeks, stock count comparison result, ticket counts week 1 versus week 4."});
  h += '</div>';
  h += hsCardEnd();

  /* 5. friction log */
  h += hsCard("Friction log", "Anything that was harder than it should have been. This is the input to the monthly friction report to Product, so rough hours are more useful than a perfect description.");
  h += '<div class="hs-scroll"><table class="hs-tbl"><thead><tr>' +
       '<th style="width:130px">Date</th><th>What happened</th>' +
       '<th style="width:100px">Hours lost</th><th style="width:150px">In the playbook?</th><th style="width:44px"></th>' +
       '</tr></thead><tbody>';
  if(!hs.friction.length){
    h += '<tr><td colspan="5" class="hs-emptyrow">No entries yet. Charter working rule: anything that took more than ' +
         '30 minutes to solve belongs here and in the playbook.</td></tr>';
  }
  hs.friction.forEach(function(f,i){
    h += '<tr>';
    h += '<td><input type="date" data-hsr="friction|' + i + '|date" value="' + esc(f.date || "") + '"/></td>';
    h += '<td><input type="text" data-hsr="friction|' + i + '|what" value="' + esc(f.what || "") + '" placeholder="Nine days waiting on the client to get their API key"/></td>';
    h += '<td><input type="number" step="any" class="num" data-hsr="friction|' + i + '|hours" value="' + esc(f.hours || "") + '" placeholder="4"/></td>';
    h += '<td><select data-hsr="friction|' + i + '|playbook">' +
         '<option value=""' + (!f.playbook ? " selected" : "") + '>Not yet</option>' +
         '<option value="Added"' + (f.playbook === "Added" ? " selected" : "") + '>Added</option>' +
         '<option value="Not needed"' + (f.playbook === "Not needed" ? " selected" : "") + '>Not needed</option>' +
         '</select></td>';
    h += '<td><button class="row-del" data-hsdel="friction|' + i + '" title="Remove row">&times;</button></td>';
    h += '</tr>';
  });
  h += '</tbody></table></div>';
  h += '<div class="hs-addrow"><button class="btn btn-ghost btn-sm" data-hsadd="friction">+ Add friction entry</button></div>';
  h += hsCardEnd();

  /* 6. sign-off */
  h += hsCard("Go-live sign-off", "You are a required approver here, not a cc. A conditional GO is a legitimate answer, but the conditions have to be written down and dated or they are not conditions.");
  h += '<div class="hs-grid">';
  h += hsf("select","signDecision","Decision",{options:["GO","GO with conditions","NO-GO"],
    sub:"Marking GO here is what unblocks this deal's go-live status in HubSpot. Nothing else does."});
  h += hsf("date","signDate","Decision date",{});
  h += hsf("text","signApprover","Approved by",{ph:"Your name",sub:"You, as the required approver, not the CSM"});
  h += hsf("date","actualGoLive","Actual go-live date",{sub:"Fill this in when the client is genuinely live, not when the connection was made"});
  h += hsf("textarea","signConditions","Conditions and known limitations communicated",{wide:true,rows:3,
    ph:"What the client was told, in writing, and when. Example: told the client on Aug 14 that Addictive does not send discount data, so discount reporting will not be available. Confirmed by email."});
  h += '</div>';
  h += hsCardEnd();

  /* 7. close */
  h += hsCard("Day 30 close", "The sheet closes at Day 30. Two ticket numbers, not a verdict: the charter KPI is a downward trend, and a trend needs two readings.");
  h += '<div class="hs-grid">';
  h += hsf("number","closeTickets1","Integration tickets, week 1",{ph:"e.g. 6",
    sub:"Count tickets tied to this integration only, not general POS or account issues"});
  h += hsf("number","closeTickets4","Integration tickets, week 4",{ph:"e.g. 1",
    sub:"A downward trend from week 1 is the charter KPI, not a specific target number"});
  h += hsf("date","closeDate","Sheet closed on",{sub:"Should match, or follow shortly after, the Day 30 audit date above"});
  h += hsf("select","closeArchived","Archived",{options:["Yes","Not yet"],
    sub:"Mark Yes once this sheet is filed away and no longer needs active tracking"});
  h += '</div>';
  h += hsCardEnd();

  wrap.innerHTML = h;
  wireHealth();
}

function hsMeta(k,v,mono){
  return '<div class="hs-mcell"><span class="k">' + esc(k) + '</span>' +
         '<span class="v' + (mono ? " mono" : "") + '">' + esc(v) + '</span></div>';
}
function hsCard(title, hint){
  return '<div class="hs-card"><div class="hs-card-hd"><h3>' + esc(title) + '</h3>' +
         (hint ? '<div class="hint">' + esc(hint) + '</div>' : '') + '</div><div class="hs-body">';
}
function hsCardEnd(){ return '</div></div>'; }

function wireHealth(){
  /* scalar fields: save on input, never re-render mid-typing */
  each("[data-hs]", function(el){
    var path = el.getAttribute("data-hs");
    var isSelect = el.tagName === "SELECT";
    var isDate = el.type === "date";
    var handler = function(){ cur.hs[path] = el.value; debounceSave(); };
    if(isSelect || isDate){
      el.onchange = function(){ cur.hs[path] = el.value; save().then(renderHealth); };
    }else{
      el.oninput = handler;
    }
  });

  /* repeating rows */
  each("[data-hsr]", function(el){
    var parts = el.getAttribute("data-hsr").split("|");
    var list = parts[0], i = +parts[1], f = parts[2];
    var write = function(){
      var rowObj = cur.hs[list][i];
      if(!rowObj) return;
      rowObj[f] = el.value;
      /* live-update the calculated variance cell without a re-render */
      if(list === "variance" && (f === "pos" || f === "supy")){
        var cell = document.querySelector('[data-varout="' + i + '"]');
        if(cell) cell.innerHTML = varCell(rowObj);
      }
      debounceSave();
    };
    if(el.tagName === "SELECT" || el.type === "date") el.onchange = write;
    else el.oninput = write;
  });

  each("[data-hsadd]", function(el){
    el.onclick = function(){
      var list = el.getAttribute("data-hsadd");
      if(list === "variance") cur.hs.variance.push({from:"",to:"",pos:"",supy:"",cause:""});
      else cur.hs.friction.push({date:"",what:"",hours:"",playbook:""});
      save().then(renderHealth);
    };
  });
  each("[data-hsdel]", function(el){
    el.onclick = function(){
      var parts = el.getAttribute("data-hsdel").split("|");
      cur.hs[parts[0]].splice(+parts[1], 1);
      save().then(renderHealth);
    };
  });

  $("hsPrint").onclick = function(){ window.print(); };
  $("hsToChecklist").onclick = function(){ goPage("checklist"); };
  $("hsCopy").onclick = function(){ copyHealthSheet(); };
}

/* ═════════════════════════════════════════════════════════════════════
   TEXT EXPORTS
   ═════════════════════════════════════════════════════════════════════ */
function toClipboard(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(
      function(){ toast("Copied to clipboard"); },
      function(){ toast("Could not copy, check browser permissions"); }
    );
  }else{
    toast("Clipboard not available in this browser");
  }
}

function copyAsText(phases, p){
  var t = totals(phases, cur.items);
  var brief = providerBrief(cur.pos);
  var anchor = kickoffAnchor(cur);
  var out = cur.client + " on " + cur.pos + "\n" + "=".repeat(60) + "\n";
  out += "Progress: " + t.done + " of " + t.all + " (" + t.pct + "%)\n";
  out += "Complexity: " + (cur.complexity || "not rated") + "\n";
  out += "Integration type: " + brief.type + "\n";
  out += "Profile created: " + (fmtDate(cur.createdAt) || "not recorded") + "\n";
  out += "Work started: " + (anchor ? fmtDate(anchor) : "no items ticked yet") + "\n";
  out += "Last activity: " + (fmtDate(cur.updatedAt) || "not recorded") + "\n";
  out += "Go-live target: " + (cur.goLiveTarget ? fmtDate(cur.goLiveTarget) +
         (cur.goLiveManual ? " (set by hand)" : " (automatic)") : "not set") + "\n";
  if(cur.specialNote && cur.specialNote.trim()){
    out += "\nSPECIAL CASE NOTE\n" + cur.specialNote.trim() + "\n";
  }
  out += "\n";

  phases.forEach(function(ph){
    out += "[" + ph.n + "] " + ph.t.toUpperCase() + (ph.gate ? "  (GATE: " + ph.gate + ")" : "") + "\n";
    ph.items.forEach(function(it){
      var st = cur.items[it.id] || {};
      var mark = st.done ? "[x]" : "[ ]";
      var label = (it.plain || it.r).replace(/<[^>]+>/g, "");
      out += "  " + mark + " " + label;
      if(it.cx && cur.complexity) out += "   -> " + cur.complexity;
      if(st.done && st.doneAt) out += "   (completed " + fmtDate(st.doneAt) + ")";
      out += "\n";
      if(st.note && st.note.trim()){
        st.note.trim().split("\n").forEach(function(line){ out += "        note: " + line + "\n"; });
      }
    });
    out += "\n";
  });

  if(p.limits && p.limits.length){
    out += "KNOWN LIMITATIONS, " + cur.pos + "\n";
    p.limits.forEach(function(l){ out += "  - " + l + "\n"; });
    out += "\n";
  }
  toClipboard(out);
}

function copyHealthSheet(){
  var hs = cur.hs, phases = buildPhases(cur.pos), t = totals(phases, cur.items);
  var anchor = kickoffAnchor(cur);
  var o = "INTEGRATION HEALTH SHEET\n" + cur.client + " on " + cur.pos + "\n" + "=".repeat(60) + "\n\n";
  o += "Complexity: " + (cur.complexity || "not rated") + "\n";
  o += "Checklist: " + t.done + " of " + t.all + " (" + t.pct + "%)\n";
  o += "Work started: " + (anchor ? fmtDate(anchor) : "not started") + "\n";
  o += "Go-live target: " + (cur.goLiveTarget ? fmtDate(cur.goLiveTarget) : "not set") + "\n";
  o += "Actual go-live: " + (hs.actualGoLive ? fmtDate(hs.actualGoLive) : "not yet") + "\n\n";

  o += "SCOPE AND CONTACTS\n";
  o += "  Contact: " + (hs.contactName || "not set") +
       (hs.contactEmail ? " / " + hs.contactEmail : "") +
       (hs.contactPhone ? " / " + hs.contactPhone : "") + "\n";
  o += "  Branches: " + (hs.branches || "not set") + "\n";
  o += "  Brands / tenants: " + (hs.brands || "not set") + "\n";
  o += "  Modifier load: " + (hs.modLoad || "not set") + "\n";
  o += "  Other pillars: " + (hs.pillars || "not set") + "\n\n";

  o += "GATE LOG\n";
  GATES.forEach(function(g){
    var st = gateStatus(phases, g.i);
    o += "  [" + (st.passed ? "PASSED" : st.open + " OPEN") + "] " + st.title;
    if(st.passed && st.at) o += " (" + fmtDate(st.at) + ")";
    o += "\n";
    var note = hs["gate" + g.i];
    if(note && note.trim()) note.trim().split("\n").forEach(function(l){ o += "        " + l + "\n"; });
  });
  o += "\n";

  o += "VARIANCE LOG\n";
  if(!hs.variance.length) o += "  No entries.\n";
  hs.variance.forEach(function(v){
    var pct = variancePct(v.pos, v.supy);
    o += "  " + (v.from || "?") + " to " + (v.to || "?") + ": POS " + (v.pos || "?") +
         " vs Supy " + (v.supy || "?") + " = " +
         (pct === null ? "not calculated" : pct.toFixed(2) + "% " + (pct < VARIANCE_KPI ? "pass" : "FAIL"));
    if(v.cause) o += "  [" + v.cause + "]";
    o += "\n";
  });
  o += "\n";

  o += "AUDITS\n";
  o += "  Day 7 completed: " + (hs.d7date ? fmtDate(hs.d7date) : "not yet") + "\n";
  if(hs.d7notes) o += "    " + hs.d7notes.replace(/\n/g, "\n    ") + "\n";
  o += "  Day 30 completed: " + (hs.d30date ? fmtDate(hs.d30date) : "not yet") + "\n";
  if(hs.d30notes) o += "    " + hs.d30notes.replace(/\n/g, "\n    ") + "\n";
  o += "\n";

  o += "FRICTION LOG\n";
  if(!hs.friction.length) o += "  No entries.\n";
  hs.friction.forEach(function(f){
    o += "  " + (f.date || "?") + ": " + (f.what || "") +
         (f.hours ? "  (" + f.hours + "h)" : "") +
         "  playbook: " + (f.playbook || "not yet") + "\n";
  });
  o += "\n";

  o += "SIGN-OFF\n";
  o += "  Decision: " + (hs.signDecision || "not recorded") + "\n";
  o += "  Date: " + (hs.signDate ? fmtDate(hs.signDate) : "not recorded") + "\n";
  o += "  Approved by: " + (hs.signApprover || "not recorded") + "\n";
  if(hs.signConditions) o += "  Conditions: " + hs.signConditions + "\n";
  o += "\n";

  o += "CLOSE\n";
  o += "  Tickets week 1: " + (hs.closeTickets1 || "not recorded") +
       "   week 4: " + (hs.closeTickets4 || "not recorded") + "\n";
  o += "  Closed on: " + (hs.closeDate ? fmtDate(hs.closeDate) : "not closed") + "\n";
  o += "  Archived: " + (hs.closeArchived || "Not yet") + "\n";

  toClipboard(o);
}

/* ═════════════════════════════════════════════════════════════════════
   CONFIRM DIALOG
   One modal serves create, reset and delete.
   ═════════════════════════════════════════════════════════════════════ */
function confirmDialog(o){
  $("cfTitle").textContent = o.title;
  $("cfBody").textContent = o.body;
  var sum = $("cfSum");
  if(o.rows && o.rows.length){
    sum.style.display = "";
    sum.innerHTML = o.rows.map(function(r){
      return '<div class="r"><span class="k">' + esc(r[0]) + '</span><span class="v">' + esc(r[1]) + '</span></div>';
    }).join("");
  }else{
    sum.style.display = "none";
    sum.innerHTML = "";
  }
  var go = $("cfGo");
  go.textContent = o.cta || "Confirm";
  go.className = "btn " + (o.danger ? "btn-solid-danger" : "btn-primary");
  confirmAction = o.onGo;
  $("confirmMask").classList.add("open");
}
function closeConfirm(){
  $("confirmMask").classList.remove("open");
  confirmAction = null;
}

function askReset(){
  var c = cur.client, pos = cur.pos;
  confirmDialog({
    title:"Reset progress for this client?",
    body:"This unchecks every item, clears all notes and completion dates, and clears the complexity rating. " +
         "The Health Sheet and the client profile are kept. This cannot be undone.",
    rows:[["Client", c], ["POS provider", pos]],
    cta:"Reset progress", danger:true,
    onGo:function(){
      cur.items = {};
      cur.complexity = "";
      if(!cur.goLiveManual) cur.goLiveTarget = "";
      openNotes = {};
      closeConfirm();
      save().then(render);
      toast("Progress reset for " + c);
    }
  });
}

function askDelete(client, pos){
  confirmDialog({
    title:"Delete this client profile?",
    body:"This permanently deletes the whole profile: the checklist, every note and completion date, the special " +
         "case note and the entire Health Sheet. It cannot be undone, and there is no backup unless you copied it out first.",
    rows:[["Client", client], ["POS provider", pos]],
    cta:"Delete permanently", danger:true,
    onGo:function(){
      closeConfirm();
      deleteClient(client, pos).then(function(){
        toast("Deleted " + client + " on " + pos);
      });
    }
  });
}

function askCreate(name, pos){
  var sameName = index.filter(function(x){
    return x.client.trim().toLowerCase() === name.trim().toLowerCase();
  });
  var body = "No profile exists for this client and POS pairing yet. Creating one starts a fresh checklist and it " +
             "will appear on the Client Tracker.";
  if(sameName.length){
    body += " Note that " + name + " already has a profile on " +
            sameName.map(function(x){ return x.pos; }).join(", ") +
            ". A second profile is correct only if this is genuinely a separate POS or tenant.";
  }
  confirmDialog({
    title:"Create a new client profile?",
    body:body,
    rows:[["Client", name], ["POS provider", pos],
          ["Integration type", providerBrief(pos).type],
          ["Checklist items", String(totals(buildPhases(pos), {}).all)]],
    cta:"Create profile",
    onGo:function(){
      closeConfirm();
      openClient(name, pos, true);
    }
  });
}

/* ═════════════════════════════════════════════════════════════════════
   CLIENT TRACKER
   ═════════════════════════════════════════════════════════════════════ */
function trackerRows(){
  return index.map(function(x){
    var row = {
      client:x.client, pos:x.pos, pct:x.pct || 0,
      done:x.done || 0, all:x.all || 0,
      complexity:x.complexity || "",
      createdAt:x.createdAt, updatedAt:x.updatedAt, goLiveTarget:x.goLiveTarget || ""
    };
    row.health = healthOf(row);
    row.reason = healthReason(row);
    return row;
  });
}
var HORDER = { critical:0, attention:1, ok:2, complete:3 };

function renderTracker(){
  var rows = trackerRows();
  var counts = { critical:0, attention:0, ok:0, complete:0 };
  rows.forEach(function(r){ counts[r.health]++; });

  var q = tracker.q.trim().toLowerCase();
  var shown = rows.filter(function(r){
    if(tracker.filter && r.health !== tracker.filter) return false;
    if(q && (r.client + " " + r.pos).toLowerCase().indexOf(q) === -1) return false;
    return true;
  });

  shown.sort(function(a,b){
    var s = tracker.sort, av, bv;
    if(s === "health"){ av = HORDER[a.health]; bv = HORDER[b.health]; }
    else if(s === "pct"){ av = a.pct; bv = b.pct; }
    else if(s === "createdAt" || s === "updatedAt"){
      av = new Date(a[s] || 0).getTime(); bv = new Date(b[s] || 0).getTime();
    }
    else if(s === "goLiveTarget"){
      av = a.goLiveTarget ? new Date(a.goLiveTarget).getTime() : 8.64e15;
      bv = b.goLiveTarget ? new Date(b.goLiveTarget).getTime() : 8.64e15;
    }
    else { av = String(a[s] || "").toLowerCase(); bv = String(b[s] || "").toLowerCase(); }
    if(av < bv) return -1 * tracker.dir;
    if(av > bv) return 1 * tracker.dir;
    return a.client.localeCompare(b.client);
  });

  var h = "";

  h += '<div class="hcards">';
  ["critical","attention","ok","complete"].forEach(function(k){
    h += '<div class="hcard ' + k + (tracker.filter === k ? " on" : "") + '" data-hfilter="' + k + '">' +
         '<div class="hcard-n">' + counts[k] + '</div>' +
         '<div class="hcard-t">' + esc(HEALTH_META[k].label) + '</div>' +
         '<div class="hcard-d">' + esc(HEALTH_META[k].desc) + '</div>' +
         '<ul class="hcard-steps">' + (HEALTH_META[k].actions || []).map(function(a){
           return '<li>' + esc(a) + '</li>';
         }).join("") + '</ul></div>';
  });
  h += '</div>';

  h += '<div class="tbar">' +
       '<input id="tq" type="text" placeholder="Search by client name or POS provider" value="' + esc(tracker.q) + '"/>';
  if(tracker.filter){
    h += '<button class="btn btn-ghost btn-sm" id="clearFilter">Clear ' + esc(HEALTH_META[tracker.filter].label) + ' filter</button>';
  }
  if(Cloud.enabled()){
    h += '<button class="btn btn-ghost btn-sm" id="cloudRefresh">Refresh from cloud</button>';
  }
  h += '<span class="filter-note">' + shown.length + ' of ' + rows.length + ' clients</span></div>';

  if(!rows.length){
    h += '<div class="empty"><h3>No clients saved yet</h3>' +
         '<p>Open a checklist on the Checklist tab and the client will appear here with its health status.</p></div>';
    $("trackerPage").innerHTML = h;
    wireTracker();
    return;
  }

  var cols = [
    ["client","Client"], ["pos","POS"], ["complexity","Complexity"], ["pct","Progress"],
    ["health","Health"], ["createdAt","Started"], ["updatedAt","Last activity"], ["goLiveTarget","Go-live target"]
  ];
  h += '<div class="tbl-wrap"><table class="tbl"><thead><tr>';
  cols.forEach(function(c){
    var active = tracker.sort === c[0];
    h += '<th data-sort="' + c[0] + '">' + esc(c[1]) +
         '<span class="ar">' + (active ? (tracker.dir === 1 ? "▲" : "▼") : "▵") + '</span></th>';
  });
  h += '<th></th></tr></thead><tbody>';

  if(!shown.length){
    h += '<tr><td colspan="9" class="td-dim" style="padding:22px 14px">Nothing matches that search and filter.</td></tr>';
  }
  shown.forEach(function(r){
    var toTarget = daysUntilTarget(r.goLiveTarget);
    h += '<tr data-open="' + esc(r.client) + '" data-openpos="' + esc(r.pos) + '">';
    h += '<td><div class="td-client">' + esc(r.client) + '</div>' +
         '<div class="td-dim" style="font-size:11.5px">' + esc(r.reason) + '</div></td>';
    h += '<td class="td-pos">' + esc(r.pos) + '</td>';
    h += '<td class="' + (r.complexity ? "td-pos" : "td-dim") + '">' + esc(r.complexity || "Not rated") + '</td>';
    h += '<td><div class="td-pct">' + r.pct + '%</div>' +
         '<div class="mini-bar"><div class="mini-fill" style="width:' + r.pct + '%;background:' + barColor(r.health) + '"></div></div></td>';
    h += '<td><span class="hbadge hb-' + r.health + '">' + esc(HEALTH_META[r.health].label) + '</span></td>';
    h += '<td class="td-dim">' + esc(fmtDate(r.createdAt) || "Not recorded") + '</td>';
    h += '<td class="td-dim">' + esc(relDays(r.updatedAt || r.createdAt)) + '</td>';
    h += '<td class="' + (toTarget !== null && toTarget < 0 && r.health !== "complete" ? "td-late" : "td-dim") + '">' +
         (r.goLiveTarget ? esc(fmtDate(r.goLiveTarget)) : "Not set") + '</td>';
    h += '<td><button class="row-del" data-del="' + esc(r.client) + '" data-delpos="' + esc(r.pos) +
         '" title="Delete this client profile">&times;</button></td>';
    h += '</tr>';
  });
  h += '</tbody></table></div>';

  $("trackerPage").innerHTML = h;
  wireTracker();
}

function wireTracker(){
  each("[data-hfilter]", function(el){
    el.onclick = function(){
      var k = el.getAttribute("data-hfilter");
      tracker.filter = (tracker.filter === k) ? null : k;
      renderTracker();
    };
  });
  var cf = $("clearFilter");
  if(cf) cf.onclick = function(){ tracker.filter = null; renderTracker(); };

  var cr = $("cloudRefresh");
  if(cr) cr.onclick = function(){
    cr.disabled = true;
    refreshCloudIndex().then(function(){ toast("Synced"); }).catch(function(){ toast("Could not reach the cloud"); });
  };

  var tq = $("tq");
  if(tq){
    tq.oninput = function(){
      tracker.q = tq.value;
      var pos = tq.selectionStart;
      renderTracker();
      var again = $("tq");
      if(again){ again.focus(); again.setSelectionRange(pos, pos); }
    };
  }

  each("[data-sort]", function(el){
    el.onclick = function(){
      var s = el.getAttribute("data-sort");
      if(tracker.sort === s) tracker.dir = -tracker.dir;
      else { tracker.sort = s; tracker.dir = 1; }
      renderTracker();
    };
  });

  /* delete must not also trigger the row's open handler */
  each("[data-del]", function(el){
    el.onclick = function(ev){
      ev.stopPropagation();
      askDelete(el.getAttribute("data-del"), el.getAttribute("data-delpos"));
    };
  });

  each("[data-open]", function(el){
    el.onclick = function(){
      openClient(el.getAttribute("data-open"), el.getAttribute("data-openpos"), false);
    };
  });
}

/* ═════════════════════════════════════════════════════════════════════
   PERSISTENCE
   ═════════════════════════════════════════════════════════════════════ */
function indexEntry(rec){
  var t = totals(buildPhases(rec.pos), rec.items);
  return {
    client:rec.client, pos:rec.pos,
    pct:t.pct, done:t.done, all:t.all,
    complexity:rec.complexity || "",
    createdAt:rec.createdAt, updatedAt:rec.updatedAt,
    goLiveTarget:rec.goLiveTarget || ""
  };
}

function save(){
  if(!cur) return Promise.resolve();
  cur.updatedAt = nowISO();
  if(!cur.createdAt) cur.createdAt = cur.updatedAt;

  var k = key(cur.client, cur.pos);
  var rest = index.filter(function(x){ return key(x.client, x.pos) !== k; });
  rest.unshift(indexEntry(cur));
  index = rest.slice(0, MAX_CLIENTS);

  Cloud.upsertRecord(cur); /* fire-and-forget, never blocks the UI */

  return DB.set(k, cur).then(function(){ return DB.set("posck:index", index); });
}

function deleteClient(client, pos){
  var k = key(client, pos);
  index = index.filter(function(x){ return key(x.client, x.pos) !== k; });
  var wasCurrent = cur && key(cur.client, cur.pos) === k;
  Cloud.deleteRecord(client, pos);
  return DB.del(k).then(function(){
    return DB.set("posck:index", index);
  }).then(function(){
    if(wasCurrent){
      cur = null;
      openNotes = {};
      $("clientName").value = "";
      $("posSelect").value = "";
      goPage(page === "health" ? "checklist" : page);
    }
    render();
  });
}

function openClient(name, pos, isNew){
  closeCombo();
  openNotes = {};
  $("clientName").value = name;
  $("posSelect").value = pos;

  /* Cloud is the shared source of truth when it is reachable, since a
     colleague may have moved this client on since the local cache was
     last written. Fall back to the local copy when offline or when
     nothing has ever been synced for this client. */
  return Promise.all([DB.get(key(name,pos)), Cloud.fetchRecord(name,pos)]).then(function(res){
    var local = res[0], remote = res[1];
    if(remote){
      remote.collapsed = (local && local.collapsed) || {};
      cur = remote;
    }else{
      cur = local || blankRecord(name,pos);
    }
    cur.client = name;
    cur.pos = pos;
    cur.items = cur.items || {};
    cur.collapsed = cur.collapsed || {};
    cur.hs = cur.hs || blankHS();
    cur.complexity = cur.complexity || "";
    cur.specialNote = cur.specialNote || "";
    cur.goLiveTarget = cur.goLiveTarget || "";
    cur.goLiveManual = !!cur.goLiveManual;
    cur.createdAt = cur.createdAt || nowISO();
    applyDefaultTarget();
    return save();
  }).then(function(){
    goPage("checklist");
    if(isNew) toast("Created " + name + " on " + pos);
  });
}

/* Open, or ask first if this pairing does not exist yet */
function requestOpen(){
  var name = $("clientName").value.trim();
  var pos = $("posSelect").value;
  if(!name){ toast("Enter a client name"); return; }
  if(!pos){ toast("Select a POS provider"); return; }
  if(!P[pos]){ toast("Unknown POS provider"); return; }

  var exists = index.some(function(x){ return key(x.client, x.pos) === key(name, pos); });
  if(exists) openClient(name, pos, false);
  else askCreate(name, pos);
}

/* ═════════════════════════════════════════════════════════════════════
   SEARCHABLE CLIENT DROPDOWN
   ═════════════════════════════════════════════════════════════════════ */
function comboMatches(){
  var q = $("clientName").value.trim().toLowerCase();
  if(!q) return index.slice(0, 8);
  return index.filter(function(x){
    return (x.client + " " + x.pos).toLowerCase().indexOf(q) !== -1;
  }).slice(0, 8);
}
function openCombo(){
  if(!index.length) return;
  combo.matches = comboMatches();
  combo.hi = -1;
  var list = $("comboList");
  if(!combo.matches.length){
    list.innerHTML = '<div class="combo-empty">No saved clients match. Press Enter to create a new one.</div>';
  }else{
    list.innerHTML = combo.matches.map(function(x,i){
      return '<div class="combo-opt" data-ci="' + i + '">' +
             '<div><div class="combo-opt-n">' + esc(x.client) + '</div>' +
             '<div class="combo-opt-s">' + esc(x.pos) + (x.complexity ? " &middot; " + esc(x.complexity) : "") + '</div></div>' +
             '<div class="combo-opt-p">' + (x.pct || 0) + '%</div></div>';
    }).join("");
    each("#comboList .combo-opt", function(el){
      el.onmousedown = function(ev){
        ev.preventDefault();
        pickCombo(+el.getAttribute("data-ci"));
      };
    });
  }
  list.classList.add("open");
  combo.open = true;
}
function closeCombo(){
  $("comboList").classList.remove("open");
  combo.open = false;
  combo.hi = -1;
}
function highlight(n){
  combo.hi = n;
  each("#comboList .combo-opt", function(el,i){
    if(i === n) el.classList.add("hi"); else el.classList.remove("hi");
  });
  var el = document.querySelector('#comboList .combo-opt.hi');
  if(el && el.scrollIntoView) el.scrollIntoView({block:"nearest"});
}
function pickCombo(i){
  var x = combo.matches[i];
  if(!x) return;
  closeCombo();
  openClient(x.client, x.pos, false);
}

/* ═════════════════════════════════════════════════════════════════════
   AUTH BAR
   Shown above the setup bar. With Cloud disabled it just says so.
   Signed out, it is an email field for a magic link. Signed in, it
   shows the email and a sign-out link.
   ═════════════════════════════════════════════════════════════════════ */
function renderAuthBar(){
  var el = $("authBar");
  if(!el) return;
  if(!Cloud.enabled()){
    el.innerHTML = '<span class="authbar-off">Cloud sync is not set up on this page yet, ' +
      'so nothing here leaves this browser. See SUPABASE.md.</span>';
    return;
  }
  var s = Cloud.session();
  if(s && s.user){
    el.innerHTML = '<span class="authbar-on">Signed in as ' + esc(s.user.email) + '</span>' +
      '<button class="link-btn" id="authSignOut">Sign out</button>';
    var out = $("authSignOut");
    if(out) out.onclick = function(){ Cloud.signOut(); };
  }else{
    el.innerHTML =
      '<input type="email" id="authEmail" placeholder="you@supy.io" autocomplete="email"/>' +
      '<button class="btn btn-primary btn-sm" id="authSend">Email me a sign-in link</button>' +
      '<span class="authbar-msg" id="authMsg"></span>';
    var email = $("authEmail"), send = $("authSend"), msg = $("authMsg");
    email.onkeydown = function(ev){ if(ev.key === "Enter"){ ev.preventDefault(); send.click(); } };
    send.onclick = function(){
      var addr = email.value.trim();
      if(!addr){ toast("Enter your email"); return; }
      send.disabled = true;
      Cloud.signIn(addr).then(function(res){
        send.disabled = false;
        msg.textContent = res.error ? res.error.message : "Check " + addr + " for the link.";
      }).catch(function(){
        send.disabled = false;
        msg.textContent = "Could not send the link. Check your connection and try again.";
      });
    };
  }
}

/* Cross-team view of the tracker: pull every signed-in staff member's
   clients and merge in anything local that has not synced up yet. */
function refreshCloudIndex(){
  return Cloud.fetchIndex().then(function(remote){
    if(!remote) return;
    var seen = {};
    remote.forEach(function(r){ seen[key(r.client, r.pos)] = true; });
    var localOnly = index.filter(function(x){ return !seen[key(x.client, x.pos)]; });
    index = remote.concat(localOnly).slice(0, MAX_CLIENTS);
    DB.set("posck:index", index);
    if(page === "tracker") renderTracker();
  });
}

/* ═════════════════════════════════════════════════════════════════════
   NAV
   ═════════════════════════════════════════════════════════════════════ */
var PAGE_HASH = { checklist:"#checklist", health:"#health-sheet", tracker:"#tracker" };
function goPage(p){
  page = p;
  $("tabChecklist").classList.toggle("on", p === "checklist");
  $("tabHealth").classList.toggle("on", p === "health");
  $("tabTracker").classList.toggle("on", p === "tracker");
  if(location.hash !== PAGE_HASH[p]){
    try{ history.replaceState(null, "", PAGE_HASH[p]); }catch(e){}
  }
  render();
}
function pageFromHash(){
  if(location.hash === "#tracker") return "tracker";
  if(location.hash === "#health-sheet") return "health";
  return "checklist";
}

/* ═════════════════════════════════════════════════════════════════════
   INIT
   ═════════════════════════════════════════════════════════════════════ */
(function init(){
  var sel = $("posSelect");
  Object.keys(P).sort().forEach(function(k){
    var o = document.createElement("option");
    o.value = k; o.textContent = k;
    sel.appendChild(o);
  });

  $("loadBtn").onclick = function(){ requestOpen(); };
  $("tabChecklist").onclick = function(){ goPage("checklist"); };
  $("tabHealth").onclick = function(){
    if(!cur){ toast("Open a client first, the Health Sheet belongs to one client"); return; }
    goPage("health");
  };
  $("tabTracker").onclick = function(){ goPage("tracker"); };

  $("cfCancel").onclick = closeConfirm;
  $("cfGo").onclick = function(){ if(confirmAction) confirmAction(); };
  $("confirmMask").onclick = function(ev){ if(ev.target === $("confirmMask")) closeConfirm(); };
  document.addEventListener("keydown", function(ev){
    if(ev.key === "Escape" && $("confirmMask").classList.contains("open")) closeConfirm();
  });

  var ci = $("clientName");
  ci.oninput = function(){ openCombo(); };
  ci.onfocus = function(){ openCombo(); };
  ci.onkeydown = function(ev){
    if(!combo.open){
      if(ev.key === "Enter"){ ev.preventDefault(); requestOpen(); }
      return;
    }
    if(ev.key === "ArrowDown"){
      ev.preventDefault();
      if(combo.matches.length) highlight((combo.hi + 1) % combo.matches.length);
    }else if(ev.key === "ArrowUp"){
      ev.preventDefault();
      if(combo.matches.length) highlight((combo.hi - 1 + combo.matches.length) % combo.matches.length);
    }else if(ev.key === "Enter"){
      ev.preventDefault();
      if(combo.hi >= 0) pickCombo(combo.hi);
      else { closeCombo(); requestOpen(); }
    }else if(ev.key === "Escape"){
      closeCombo();
    }
  };
  document.addEventListener("click", function(ev){
    if(!ev.target.closest || !ev.target.closest(".combo")) closeCombo();
  });

  window.addEventListener("hashchange", function(){ goPage(pageFromHash()); });

  renderAuthBar();
  Cloud.onChange(function(){
    renderAuthBar();
    refreshCloudIndex();
  });

  DB.get("posck:index").then(function(ix){
    if(ix && Array.isArray(ix)) index = ix;
    var p = pageFromHash();
    goPage(p === "health" && !cur ? "checklist" : p);
    refreshCloudIndex();
  });
})();

})();
</script>
</body>
</html>
