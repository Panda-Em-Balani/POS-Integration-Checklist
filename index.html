<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>POS Integration Checklist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#321e57; --purple:#503390; --bright:#7b51bf; --action:#6C3FC5; --purple-dark:#4A2A8A;
  --yellow:#fcd34d; --blue:#109ae7; --orange:#fb763c; --red:#c2260c; --green:#40c798;
  --bg-success:#E8FAF0; --tx-success:#1A8A5C;
  --bg-warning:#FEF9EC; --tx-warning:#B8860B;
  --bg-error:#FEE2E2;   --tx-error:#DC2626;
  --bg-info:#EBF3FC;    --tx-info:#1E5FA8;
  --bg-neutral:#EDE9FB; --tx-neutral:#6C3FC5;
  --bg-orange:#FFF1E8;  --tx-orange:#C2560F;
  --text:#1A1A2E; --border:#efedfa; --page:#f4f1fa; --card:#ffffff;
  --mid:#888888; --light:#F6F5FA;
  --font:'Noto Sans',system-ui,-apple-system,sans-serif;
  --mono:'SF Mono','Fira Code',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--page)}
#supy-app{font-family:var(--font);color:var(--text);background:var(--page);padding:20px;line-height:1.5;
  max-width:1400px;margin:0 auto}
#supy-app h1,#supy-app h2,#supy-app h3,#supy-app p{margin:0}

/* ---------- Header + nav ---------- */
.hd{background:var(--navy);border-radius:12px;padding:20px 24px;margin-bottom:16px}
.hd-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.hd h1{color:#fff;font-size:22px;font-weight:600;letter-spacing:-.01em}
.hd p{color:#C9BEE0;font-size:12px;margin-top:4px}
.nav{display:flex;gap:6px;flex-shrink:0}
.nav-tab{font-family:var(--font);font-size:13px;font-weight:600;padding:8px 16px;border-radius:8px;
  border:1.5px solid rgba(255,255,255,.2);background:transparent;color:#C9BEE0;cursor:pointer;white-space:nowrap}
.nav-tab:hover{background:rgba(255,255,255,.1);color:#fff}
.nav-tab.on{background:#fff;color:var(--navy);border-color:#fff}

/* ---------- Setup bar ---------- */
.setup{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:16px}
.setup-grid{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}
.fld{display:flex;flex-direction:column;gap:5px;flex:1;min-width:190px}
.fld label{font-size:11px;font-weight:600;color:var(--mid);text-transform:uppercase;letter-spacing:.06em}
.fld input,.fld select,.fld textarea{font-family:var(--font);font-size:14px;padding:10px 12px;border:1.5px solid var(--border);
  border-radius:8px;background:#fff;color:var(--text);outline:none;width:100%}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--action)}
.fld select{cursor:pointer}

.btn{font-family:var(--font);font-size:13px;font-weight:600;padding:10px 16px;border-radius:8px;
  border:1.5px solid transparent;cursor:pointer;white-space:nowrap;transition:background .15s}
.btn-primary{background:var(--action);color:#fff}
.btn-primary:hover{background:var(--purple-dark)}
.btn-ghost{background:#fff;color:var(--action);border-color:var(--border)}
.btn-ghost:hover{background:var(--light)}
.btn-danger{background:#fff;color:var(--tx-error);border-color:#F5C6C6}
.btn-danger:hover{background:var(--bg-error)}
.btn-solid-danger{background:var(--tx-error);color:#fff}
.btn-solid-danger:hover{background:#B01E1E}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* ---------- Client search combo ---------- */
.combo{position:relative}
.combo-list{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#fff;border:1.5px solid var(--border);
  border-radius:8px;box-shadow:0 8px 24px rgba(50,30,87,.14);z-index:60;max-height:260px;overflow-y:auto;display:none}
.combo-list.open{display:block}
.combo-opt{padding:9px 12px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;
  border-bottom:1px solid var(--border)}
.combo-opt:last-child{border-bottom:none}
.combo-opt:hover,.combo-opt.hi{background:var(--bg-neutral)}
.combo-opt-n{font-size:13.5px;font-weight:600}
.combo-opt-s{font-size:11.5px;color:var(--mid)}
.combo-opt-p{font-family:var(--mono);font-size:11.5px;color:var(--tx-neutral);font-weight:600;flex-shrink:0}
.combo-empty{padding:11px 12px;font-size:12.5px;color:var(--mid)}

/* ---------- Saved clients ---------- */
.saved{margin-top:14px;padding-top:14px;border-top:1px solid var(--border)}
.saved-lbl{font-size:11px;font-weight:600;color:var(--mid);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--bg-neutral);color:var(--tx-neutral);border:1px solid #DDD3F5;border-radius:20px;
  padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:8px}
.chip:hover{background:#E0D6F8}
.chip.on{background:var(--action);color:#fff;border-color:var(--action)}
.chip .pct{font-family:var(--mono);font-size:11px;opacity:.85}

/* ---------- Two-column layout ---------- */
.layout{display:flex;gap:16px;align-items:flex-start}
.col-main{flex:1;min-width:0}
.col-side{width:330px;flex:0 0 330px;position:sticky;top:16px}

/* ---------- Sidebar ---------- */
.side-card{background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:12px;overflow:hidden}
.side-hd{background:var(--navy);padding:12px 16px}
.side-hd h3{color:#fff;font-size:13.5px;font-weight:600}
.side-hd .side-sub{color:#C9BEE0;font-size:11.5px;margin-top:3px}
.side-body{padding:14px 16px}
.side-sec-t{font-size:10.5px;font-weight:700;color:var(--mid);text-transform:uppercase;letter-spacing:.07em;margin-bottom:9px}
.side-cred{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);align-items:flex-start}
.side-cred:last-child{border-bottom:none}
.side-cred-b{flex:1;min-width:0}
.side-cred-n{font-size:12.5px;font-weight:600;line-height:1.35}
.side-cred.on .side-cred-n{color:var(--mid);text-decoration:line-through}
.side-cred-i{font-size:11.5px;color:#666;margin-top:3px}
.side-cred-ex{font-family:var(--mono);font-size:11px;color:var(--tx-neutral);background:var(--bg-neutral);
  border-radius:4px;padding:2px 6px;margin-top:4px;display:inline-block;word-break:break-all}
.side-lim{font-size:12px;color:var(--tx-warning);background:var(--bg-warning);border-radius:6px;
  padding:8px 10px;margin-bottom:7px;line-height:1.45}
.side-lim:last-child{margin-bottom:0}
.side-none{font-size:12px;color:var(--mid);font-style:italic}
.side-fld{margin-top:0}
.side-fld label{font-size:10.5px;font-weight:700;color:var(--mid);text-transform:uppercase;letter-spacing:.07em;
  display:block;margin-bottom:5px}
.side-fld input,.side-fld textarea{font-family:var(--font);font-size:13px;padding:9px 10px;border:1.5px solid var(--border);
  border-radius:8px;background:#fff;color:var(--text);outline:none;width:100%;resize:vertical}
.side-fld input:focus,.side-fld textarea:focus{border-color:var(--action)}
.side-fld .hint{font-size:11px;color:var(--mid);margin-top:5px;line-height:1.4}
.side-tag{display:inline-block;font-size:10px;font-weight:700;padding:3px 9px;border-radius:5px;
  text-transform:uppercase;letter-spacing:.05em}

/* ---------- Progress ---------- */
.prog-wrap{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:16px}
.prog-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;flex-wrap:wrap;gap:8px}
.prog-title{font-size:15px;font-weight:600}
.prog-title .sub{color:var(--mid);font-weight:400;font-size:13px}
.prog-num{font-family:var(--mono);font-size:13px;color:var(--mid)}
.bar{height:9px;background:var(--border);border-radius:20px;overflow:hidden}
.bar-fill{height:100%;background:var(--action);border-radius:20px;transition:width .3s ease}
.bar-fill.done{background:var(--green)}
.gate-warn{margin-top:12px;background:var(--bg-warning);border-left:3px solid var(--yellow);
  padding:10px 12px;border-radius:0 6px 6px 0;font-size:12.5px;color:var(--tx-warning)}
.gate-ok{margin-top:12px;background:var(--bg-success);border-left:3px solid var(--green);
  padding:10px 12px;border-radius:0 6px 6px 0;font-size:12.5px;color:var(--tx-success);font-weight:600}

/* ---------- Phase ---------- */
.phase{background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:12px;overflow:hidden}
.phase-hd{background:var(--purple);padding:13px 18px;display:flex;align-items:center;gap:12px;cursor:pointer;user-select:none}
.phase-hd:hover{background:var(--purple-dark)}
.phase-n{background:rgba(255,255,255,.18);color:#fff;font-family:var(--mono);font-size:11px;font-weight:700;
  width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.phase-t{color:#fff;font-size:14.5px;font-weight:600;flex:1}
.phase-t .gate{background:var(--yellow);color:var(--navy);font-size:9.5px;font-weight:700;padding:2px 7px;
  border-radius:4px;margin-left:9px;text-transform:uppercase;letter-spacing:.05em;vertical-align:middle}
.phase-c{font-family:var(--mono);font-size:11.5px;color:#D9CFF0;flex-shrink:0}
.phase-ar{color:#fff;font-size:11px;opacity:.75;transition:transform .2s;flex-shrink:0}
.phase.closed .phase-ar{transform:rotate(-90deg)}
.phase.closed .phase-body{display:none}
.phase.complete .phase-hd{background:var(--tx-success)}
.phase.complete .phase-hd:hover{background:#157049}

/* ---------- Items ---------- */
.item{display:flex;gap:13px;padding:14px 18px;border-bottom:1px solid var(--border);align-items:flex-start}
.item:last-child{border-bottom:none}
.item:hover{background:var(--light)}
.item.checked{background:#FAFCFB}
.item.checked .item-req{text-decoration:line-through;color:var(--mid)}

.cb{width:20px;height:20px;border:2px solid #C9BEE0;border-radius:5px;cursor:pointer;flex-shrink:0;
  margin-top:1px;display:flex;align-items:center;justify-content:center;background:#fff;transition:all .12s}
.cb:hover{border-color:var(--action)}
.cb.on{background:var(--green);border-color:var(--green)}
.cb.on::after{content:'';width:5px;height:9px;border:solid #fff;border-width:0 2.5px 2.5px 0;
  transform:rotate(45deg);margin-top:-2px}
.cb.sm{width:17px;height:17px;border-radius:4px}
.cb.sm.on::after{width:4px;height:8px;border-width:0 2px 2px 0}

.item-body{flex:1;min-width:0}
.item-req{font-size:13.5px;font-weight:600;margin-bottom:3px}
.item-req .cred{font-family:var(--mono);background:var(--bg-neutral);color:var(--tx-neutral);
  padding:1px 6px;border-radius:4px;font-size:12px;font-weight:600}
.item-ins{font-size:12.5px;color:#555;margin-bottom:5px}
.item-ex{font-family:var(--mono);font-size:11.5px;color:var(--tx-neutral);background:var(--bg-neutral);
  border-radius:5px;padding:3px 8px;display:inline-block;margin-top:2px;word-break:break-word}
.item-note{font-size:12px;background:var(--bg-warning);color:var(--tx-warning);border-radius:6px;
  padding:7px 10px;margin-top:6px;display:flex;gap:7px;align-items:flex-start}
.item-note::before{content:'!';font-weight:800;flex-shrink:0;font-family:var(--mono)}
.item-note.info{background:var(--bg-info);color:var(--tx-info)}
.item-note.info::before{content:'i'}

.item-meta{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:7px}
.done-at{font-size:11.5px;color:var(--tx-success);font-weight:600}
.note-btn{background:none;border:none;padding:0;font-family:var(--font);font-size:11.5px;font-weight:600;
  color:var(--action);cursor:pointer;text-decoration:underline}
.note-btn:hover{color:var(--purple-dark)}
.note-box{margin-top:8px}
.note-box textarea{font-family:var(--font);font-size:12.5px;padding:9px 11px;border:1.5px solid #DDD3F5;
  border-radius:8px;background:#fff;color:var(--text);outline:none;width:100%;min-height:64px;resize:vertical}
.note-box textarea:focus{border-color:var(--action)}
.note-saved{font-size:12.5px;background:var(--bg-neutral);color:#4A3A6E;border-left:3px solid var(--action);
  border-radius:0 6px 6px 0;padding:7px 11px;margin-top:7px;white-space:pre-wrap;word-break:break-word}

.owner{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px;
  text-transform:uppercase;letter-spacing:.04em;margin-left:8px;vertical-align:middle}
.ow-client{background:var(--bg-info);color:var(--tx-info)}
.ow-me{background:var(--bg-neutral);color:var(--tx-neutral)}
.ow-csm{background:var(--bg-warning);color:var(--tx-warning)}
.ow-eng{background:var(--bg-error);color:var(--tx-error)}

/* ---------- Provider banner ---------- */
.pbanner{background:linear-gradient(135deg,#1A0B3D,#503390);border-radius:12px;padding:16px 20px;margin-bottom:16px}
.pbanner-t{color:#fff;font-size:16px;font-weight:600;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pbanner-tag{font-size:10px;font-weight:700;padding:3px 9px;border-radius:5px;text-transform:uppercase;letter-spacing:.05em}
.tag-self{background:var(--bg-success);color:var(--tx-success)}
.tag-assist{background:var(--bg-warning);color:var(--tx-warning)}
.tag-tech{background:var(--bg-error);color:var(--tx-error)}
.pbanner-n{color:#D0B4FF;font-size:12.5px;margin-top:8px;line-height:1.55}
.pbanner-recon{margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.15);
  color:#C9BEE0;font-size:12px;font-family:var(--mono)}

/* ---------- Empty ---------- */
.empty{background:var(--card);border:2px dashed var(--border);border-radius:12px;padding:48px 24px;text-align:center}
.empty h3{font-size:16px;font-weight:600;margin-bottom:6px}
.empty p{font-size:13px;color:var(--mid)}

.toolbar{display:flex;gap:8px;justify-content:flex-end;margin-bottom:14px;flex-wrap:wrap}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;
  padding:11px 20px;border-radius:8px;font-size:13px;font-weight:600;z-index:999;opacity:0;
  transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}

/* ---------- Health tracker ---------- */
.hcards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.hcard{background:var(--card);border:1px solid var(--border);border-left:4px solid var(--mid);border-radius:12px;
  padding:16px 18px;cursor:pointer;transition:box-shadow .15s,transform .15s}
.hcard:hover{box-shadow:0 6px 18px rgba(50,30,87,.1);transform:translateY(-1px)}
.hcard.on{box-shadow:0 0 0 2px var(--action)}
.hcard-n{font-family:var(--mono);font-size:28px;font-weight:700;line-height:1.1}
.hcard-t{font-size:12.5px;font-weight:700;margin-top:4px}
.hcard-d{font-size:11px;color:var(--mid);margin-top:5px;line-height:1.4}
.hcard.critical{border-left-color:var(--tx-error)} .hcard.critical .hcard-n,.hcard.critical .hcard-t{color:var(--tx-error)}
.hcard.attention{border-left-color:var(--orange)} .hcard.attention .hcard-n,.hcard.attention .hcard-t{color:var(--tx-orange)}
.hcard.ok{border-left-color:var(--green)} .hcard.ok .hcard-n,.hcard.ok .hcard-t{color:var(--tx-success)}
.hcard.complete{border-left-color:var(--action)} .hcard.complete .hcard-n,.hcard.complete .hcard-t{color:var(--tx-neutral)}

.tbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.tbar input{font-family:var(--font);font-size:14px;padding:10px 12px;border:1.5px solid var(--border);
  border-radius:8px;background:#fff;outline:none;flex:1;min-width:220px}
.tbar input:focus{border-color:var(--action)}
.tbar .filter-note{font-size:12.5px;color:var(--mid)}

.tbl-wrap{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;min-width:860px}
table.tbl th{background:var(--light);font-size:10.5px;font-weight:700;color:var(--mid);text-transform:uppercase;
  letter-spacing:.06em;text-align:left;padding:11px 14px;border-bottom:1px solid var(--border);cursor:pointer;white-space:nowrap}
table.tbl th:hover{color:var(--action)}
table.tbl th .ar{opacity:.5;font-size:9px;margin-left:4px}
table.tbl td{padding:12px 14px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle}
table.tbl tr:last-child td{border-bottom:none}
table.tbl tbody tr{cursor:pointer}
table.tbl tbody tr:hover{background:var(--light)}
.td-client{font-weight:600}
.td-pos{color:#555;font-size:12.5px}
.mini-bar{height:6px;background:var(--border);border-radius:20px;overflow:hidden;width:78px;margin-top:5px}
.mini-fill{height:100%;border-radius:20px}
.td-pct{font-family:var(--mono);font-size:12.5px;font-weight:600}
.hbadge{display:inline-block;font-size:10px;font-weight:700;padding:3px 9px;border-radius:5px;
  text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.hb-critical{background:var(--bg-error);color:var(--tx-error)}
.hb-attention{background:var(--bg-orange);color:var(--tx-orange)}
.hb-ok{background:var(--bg-success);color:var(--tx-success)}
.hb-complete{background:var(--bg-neutral);color:var(--tx-neutral)}
.td-dim{color:var(--mid);font-size:12.5px}
.td-late{color:var(--tx-error);font-weight:600;font-size:12.5px}

/* ---------- Modal ---------- */
.mask{position:fixed;inset:0;background:rgba(26,11,61,.5);z-index:900;display:none;align-items:center;
  justify-content:center;padding:20px}
.mask.open{display:flex}
.modal{background:#fff;border-radius:14px;padding:24px;max-width:440px;width:100%;box-shadow:0 20px 50px rgba(26,11,61,.3)}
.modal h3{font-size:16.5px;font-weight:600;margin-bottom:9px}
.modal p{font-size:13.5px;color:#555;line-height:1.55}
.modal-btns{display:flex;gap:9px;justify-content:flex-end;margin-top:20px}

/* ---------- Responsive ---------- */
@media (max-width:900px){
  #supy-app{padding:14px}
  .layout{flex-direction:column}
  .col-side{width:100%;flex:1 1 auto;position:static;order:2}
  .col-main{order:1;width:100%}
  .hcards{grid-template-columns:repeat(2,1fr)}
  .hd-top{flex-direction:column}
  .nav{width:100%}
  .nav-tab{flex:1;text-align:center}
}
@media (max-width:600px){
  #supy-app{padding:10px}
  .hd{padding:16px 16px}
  .hd h1{font-size:18px}
  .setup{padding:14px}
  .fld{flex:1 1 100%;min-width:0}
  .fld div.combo{width:100%}
  .setup-grid .fld[data-btn]{width:100%}
  .setup-grid .fld[data-btn] .btn{width:100%}
  .hcards{grid-template-columns:1fr}
  .item{padding:12px 13px;gap:10px}
  .phase-hd{padding:11px 13px;gap:9px}
  .phase-t{font-size:13.5px}
  .item-req{font-size:13px}
  .item-ins{font-size:12px}
  .prog-wrap,.pbanner{padding:14px}
  .toolbar{justify-content:stretch}
  .toolbar .btn{flex:1 1 auto}
}

/* ---------- Print ---------- */
@media print{
  @page{margin:14mm}
  html,body{background:#fff}
  #supy-app{background:#fff;padding:0;max-width:none}
  .nav,.setup,.toolbar,.col-side,.toast,.mask,#trackerPage,.note-btn{display:none !important}
  .layout{display:block}
  .col-main{width:100%}
  .hd{background:#fff;border:1px solid #ccc;padding:0 0 10px 0;margin-bottom:12px;border-width:0 0 1px 0}
  .hd h1{color:#000;font-size:18px}
  .hd p{color:#555}
  .phase{break-inside:auto;page-break-inside:auto;border:1px solid #ccc;margin-bottom:10px}
  .phase.closed .phase-body{display:block !important}
  .phase.closed .phase-ar,.phase-ar{display:none}
  .phase-hd{background:#503390 !important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .phase.complete .phase-hd{background:#1A8A5C !important}
  .item{break-inside:avoid;page-break-inside:avoid}
  .item:hover{background:transparent}
  .cb{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .cb.on{background:#40c798 !important;border-color:#40c798 !important}
  .pbanner{background:#f4f1fa !important;-webkit-print-color-adjust:exact;print-color-adjust:exact;border:1px solid #ccc}
  .pbanner-t{color:#321e57}
  .pbanner-n{color:#4A3A6E}
  .pbanner-recon{color:#555}
  .item-note,.note-saved,.item-ex{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>

<div id="supy-app">
  <div class="hd">
    <div class="hd-top">
      <div>
        <h1>POS Integration Checklist</h1>
        <p>Pick a client and their POS. The checklist builds itself. Everything saves in this browser as you go.</p>
      </div>
      <div class="nav">
        <button class="nav-tab on" id="tabChecklist">Checklist</button>
        <button class="nav-tab" id="tabTracker">Client Tracker</button>
      </div>
    </div>
  </div>

  <div id="checklistPage">
    <div class="setup">
      <div class="setup-grid">
        <div class="fld">
          <label>Client / retailer name</label>
          <div class="combo">
            <input id="clientName" type="text" placeholder="Search saved clients, or type a new name" autocomplete="off"/>
            <div class="combo-list" id="comboList"></div>
          </div>
        </div>
        <div class="fld">
          <label>POS provider</label>
          <select id="posSelect"><option value="">Select a POS...</option></select>
        </div>
        <div class="fld" data-btn style="flex:0 0 auto;min-width:auto">
          <button class="btn btn-primary" id="loadBtn">Load checklist</button>
        </div>
      </div>
      <div class="saved" id="savedWrap" style="display:none">
        <div class="saved-lbl">Saved clients</div>
        <div class="chips" id="chips"></div>
      </div>
    </div>

    <div class="layout">
      <div class="col-main" id="main"></div>
      <div class="col-side" id="side"></div>
    </div>
  </div>

  <div id="trackerPage" style="display:none"></div>
</div>

<div class="toast" id="toast"></div>

<div class="mask" id="resetMask">
  <div class="modal">
    <h3>Reset this checklist?</h3>
    <p id="resetTxt"></p>
    <div class="modal-btns">
      <button class="btn btn-ghost" id="resetCancel">Cancel</button>
      <button class="btn btn-solid-danger" id="resetGo">Reset</button>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";

/* ═════════════════════════════════════════════════════════════════════
   PROVIDER DATA
   type   : self | assist | tech
   note   : plain-language summary of how setup works
   limits : array of known limitations (shown in the sidebar)
   recon  : where to pull the comparison report from in the POS
   creds  : [{r: field name, i: what it is / where it goes, ex: format example,
              n: warning note, nt: '' | 'info'}]
   ═════════════════════════════════════════════════════════════════════ */
var P = {

"Addictive":{type:"self",auth:"API (phone + password)",
  note:"Nothing to arrange with Supy first. Ask the client to get both details from their Addictive contact.",
  limits:["Addictive does not share discounts at all. Discount amounts will never appear in Supy sales data, even when the cashier applied them on the POS. Tell the client this before go-live so it is not a surprise later."],
  recon:"Reports > Reports Dashboard > Sales Report. Net Sales = Total Sales Excl. Tax. Gross Sales = Total Sales Incl. Tax.",
  creds:[
    {r:"Phone number",i:"The phone number the Addictive account is registered under. Goes in the 'Enter Phone' field in Supy.",ex:"+971 50 123 4567"},
    {r:"Password",i:"The password for that same Addictive account. Goes in the 'Enter Password' field."}
  ]},

"AI Menu":{type:"self",auth:"API (key + secret)",
  note:"Ask the client to get both values from their AI Menu contact.",
  limits:["A refund with no matching sale on the same day gets dropped from Supy sales data, unless someone marks it as wastage."],
  recon:"Administration > View History > Custom Sales Report. Settled Gross Total = Total Sales Incl. Tax. Net Total = Total Sales Excl. Tax. Total Discount = Total Discount Value.",
  creds:[
    {r:"Client ID",i:"Goes in the 'Key' field when you add AI Menu as a POS in Supy."},
    {r:"Client Secret",i:"Goes in the 'Secret' field, right below the Key."}
  ]},

"Castle IT":{type:"assist",auth:"API (Supy assists)",
  note:"The client asks their Castle IT contact for these, then hands them to the CSM. Supy finishes the connection, usually within 48 hours.",
  limits:["Item mapping is manual for Castle IT. Items get uploaded using the Menu Items Template instead of syncing from the POS, so plan extra time for it.","We have no documentation on how Castle IT handles discounts and modifiers. Check the behaviour yourself before you promise either to the client."],
  creds:[
    {r:"Access Token",i:"Collect it from the client and pass it to the CSM. Supy does the authentication, not you."},
    {r:"Organization ID (one per branch)",i:"Every branch has its own ID. Write each one next to the Supy branch name it belongs to, or the mapping will go to the wrong site."},
    {r:"Host URL",i:"The Castle IT address for this client's account.",ex:"yourcompany.castleit.com"},
    {r:"Branch details for the CSM",i:"For each branch, send the CSM five things: retailer name, Castle IT organization ID, Supy branch name, the date and time sales should start from, and the tenant name."}
  ]},

"Clover":{type:"self",auth:"OAuth (client logs in)",
  note:"Nothing to request from Clover. The client signs into their own Clover account in a popup window during setup.",
  limits:["Every Clover location becomes its own separate tenant in Supy. A client with 5 locations means 5 tenants, not 1. Rate the job as more complex and plan the extra setup time."],
  recon:"Reports > Sales Report, with a custom date range. Net Sales = Total Sales Excl. Tax.",
  creds:[
    {r:"Clover portal email",i:"The client types this on the Clover login page after Supy redirects them. You never see it."},
    {r:"Clover portal password",i:"The client types this on the same Clover login page."},
    {r:"Region",i:"You pick this from a dropdown in Supy before the redirect. Get it wrong and the login page will reject the account."},
    {r:"Which merchant / location to connect",i:"The client picks the location. The Supy tenant is created at that moment, so repeat this once per location."}
  ]},

"CompuCash":{type:"self",auth:"API (name + secret)",
  note:"Ask the client to get both values from their CompuCash or Revel contact.",
  limits:["We have no documentation on how CompuCash handles discounts and modifiers. Confirm the behaviour before you commit to either with the client."],
  recon:"Sales > Sales Report. Sum with VAT = Revenue Incl. Tax. Sum without VAT = Revenue Excl. Tax. Watch out: the time picker defaults to 06:00 AM, so the last day gets left out unless you change it.",
  creds:[
    {r:"Client Name",i:"Goes in the Name field when you add CompuCash in Supy. This is an account identifier, not the restaurant's trading name."},
    {r:"Client Secret",i:"Goes in the Secret field."}
  ]},

"Dinlr":{type:"self",auth:"OAuth (client logs in)",
  note:"Nothing to request from Dinlr. The client signs into their own account during setup.",
  limits:[],
  recon:"Overview > Reports > Sales Report > Sales Summary. Totals = Total Sales Incl. Tax. Net Sales = Total Sales Excl. Tax.",
  creds:[
    {r:"Dinlr username",i:"The client types this on the Dinlr login page."},
    {r:"Dinlr password",i:"The client types this on the same page."},
    {r:"Branch selected and access allowed",i:"The client picks the branch and clicks to allow access. Without that last click the connection never completes."}
  ]},

"Dual Link":{type:"self",auth:"API (username + password)",
  note:"Ask the client to get both from their Dual Link contact.",
  limits:[],
  recon:"Reports > Sales by Product. PRODUCT (a * means it is a modifier) = POS Item Name. BASE = Total Sales Excl. Tax. TOTAL = Total Sales Incl. Tax. DISCOUNTED = Total Discount Value.",
  creds:[
    {r:"Username",i:"Goes in Supy when you add Dual Link."},
    {r:"Password",i:"Goes in Supy right below the username."}
  ]},

"Eats365":{type:"assist",auth:"API (Supy assists)",
  note:"The order of steps matters here. The CSM has to start with Eats365 support and send an access token to the client's Eats365 contact, who redeems it on the merchant portal. Only after that can the client connect. Start this on day one.",
  limits:["Sales types are not pulled in automatically. Each one has to be typed in by hand, by code and name (pick_up, delivery, dine_in). If the client adds a new order type later, someone has to remember to add it here too, or those sales arrive with no type on them."],
  creds:[
    {r:"CSM raises the request with Eats365",i:"Do this first. Nothing else can start until it is done. The CSM contacts Eats365 support and gets the access token."},
    {r:"Eats365 contact redeems the token",i:"The client's Eats365 contact redeems the token on the Eats365 merchant portal."},
    {r:"Item Access Permission switched on",i:"The client asks their Eats365 contact to turn on Item Access Permission for the integration user.",n:"Without this, no menu item data comes through and item mapping cannot start at all."},
    {r:"Restaurant Code",i:"The client finds this in their Eats365 restaurant settings, then it goes into Supy."}
  ]},

"Fascano":{type:"self",auth:"API (email + password)",
  note:"Ask the client to get both from their Fascano contact.",
  limits:["Discount handling is not fully documented. Check it yourself before promising the client that discounts will show up."],
  creds:[
    {r:"Email",i:"The email the Fascano account is registered under.",ex:"operations@yourcompany.com"},
    {r:"Password",i:"The password for that Fascano account."}
  ]},

"Flex Catering":{type:"self",auth:"API (key + host)",
  note:"Ask the client to get both from their Flex Catering contact.",
  limits:["Every product in Flex Catering needs its own SKU, and none can be blank, or item mapping breaks. Check the client's SKU list before you start mapping, not after.","Only orders marked 'invoiced' get pulled in. Payment status does not matter, invoiced status does.","Combo contents and item attributes are not recorded item by item, so you cannot see what was inside a combo."],
  creds:[
    {r:"X-API-KEY",i:"Goes in the 'Key' field when you add Flex as a POS in Supy."},
    {r:"Host address",i:"Goes in the 'Host' field.",ex:"yourcompany.flexcatering.com"},
    {r:"SKU check done",i:"Go through the client's product list with them and confirm every product has its own SKU and none are blank. Example: two different cakes both with a blank SKU will collide during mapping."}
  ]},

"Foodics":{type:"self",auth:"OAuth (client logs in)",
  note:"Nothing to request from Foodics. The client signs into their own account in a popup and approves the permissions Supy asks for.",
  limits:["The business day opening and closing times have to match between Foodics and Supy, branch by branch. If they do not, orders near the cutoff land on different dates in each system and the daily totals will never agree. Check this before you validate, not after you find a mismatch.","Items sold at 100% discount are left out of the Foodics net quantity but counted in Supy, so quantities can differ on days with giveaways."],
  recon:"Reports > Sales Reports > Sales by Product. Use Sales by Product, not Sales by Branch, because the two do not agree. Do not tick 'group by day' either, it inflates the revenue figure.",
  creds:[
    {r:"Account Number",i:"The client types this on the Foodics login popup.",ex:"12345"},
    {r:"Email",i:"The email on the client's Foodics account."},
    {r:"Password",i:"The password for that Foodics account."},
    {r:"Permissions approved",i:"The client has to read the permission list and click to allow it. If they close the popup instead, the connection silently fails."},
    {r:"Business day cutoff matched",i:"For every branch, check the opening and closing time in Foodics is the same as in Supy. Example: Foodics ends the day at 03:00 but Supy at 02:00 means every order between 02:00 and 03:00 lands on the wrong date.",n:"This one mismatch causes more Foodics reconciliation failures than everything else put together."}
  ]},

"ForkPOS":{type:"assist",auth:"API (Supy assists)",
  note:"The client asks their ForkPOS contact for the Location IDs and hands them to the CSM. Supy finishes the connection, usually within 48 hours.",
  limits:["Discount and modifier handling is not documented. Confirm how it behaves before committing to either."],
  creds:[
    {r:"Location ID (one per branch)",i:"One ID per branch, collected from the client's ForkPOS contact."},
    {r:"Branch details for the CSM",i:"For each branch, send the CSM: retailer name, ForkPOS Location ID, Supy branch name, the date and time sales should start from, and the tenant name."}
  ]},

"Geidea":{type:"assist",auth:"API (Supy assists)",
  note:"The order matters. The CSM has to ask the Geidea team to switch on integration access for the client's account before the client can connect anything. Raise it on day one, because you are waiting on a third party.",
  limits:["Type the host address exactly as Geidea gave it, but drop the 'admin-' prefix if it is there. Some Geidea URLs include it and the connection fails if you leave it in.","Discount and modifier handling is not documented."],
  creds:[
    {r:"CSM asks Geidea to switch on access",i:"Do this first. Nothing works until Geidea enables integration access on the client's account."},
    {r:"Geidea host address",i:"Enter it without any 'admin-' prefix.",ex:"yourbusiness.geideapos.net (not admin-yourbusiness.geideapos.net)"}
  ]},

"GoTab":{type:"self",auth:"API (key + secret)",
  note:"Ask the client to get both from their GoTab contact.",
  limits:["You cannot tell which item a discount was applied to. GoTab spreads every discount evenly across all items in the order, so item-level discount reporting is not possible.","A day's sales only become available once GoTab closes the fiscal day. Pull a day that is still open and you get nothing back, which looks like a broken connection but is not."],
  creds:[
    {r:"API Access ID",i:"Goes in the 'Key' field when you add GoTab in Supy."},
    {r:"API Access Secret",i:"Goes in the 'Secret' field."}
  ]},

"Grubtech (via API)":{type:"tech",auth:"API (Supy Engineering)",
  note:"Supy Integrations sets this one up, not you. The client either asks their Grubtech contact for the credentials, or emails Grubtech directly with the CSM copied in.",
  limits:["If one Grubtech Location ID covers several stores, item mapping cannot sync automatically and items have to be uploaded by hand. Find this out early, because it changes the plan.","Schedule the sales sync at least 3 hours after the last shift closes, or you will pull incomplete days.","Grubtech only supports cancelling a whole order. Partial cancellations and returns do not come through."],
  recon:"Real-Time Reports > Sales > Locations. Net Sales = Total Sales Excl. Tax, and it may include delivery charges. Gross Sales = Total Sales Incl. Tax. Discounts = Total Discount Value.",
  creds:[
    {r:"Sales API Key",i:"Collect from the client and pass to the CSM for the Integrations team."},
    {r:"Menu-Items API Key",i:"A second, separate key. Collect it and pass it on with the first."},
    {r:"Store ID",i:"Collect from the client, pass to the CSM."},
    {r:"Location ID",i:"Collect from the client, pass to the CSM.",n:"Ask whether this same ID is used for more than one store. If it is, item mapping becomes manual."},
    {r:"Sync scheduled 3h+ after cutoff",i:"Confirm with the Integrations team that the sync runs at least 3 hours after the last shift closes."}
  ]},

"Grubtech (via Webhooks)":{type:"tech",auth:"Webhook (Supy Engineering)",
  note:"Supy Integrations builds the webhook connection, usually within 48 hours of getting the branch details. Supy gives Grubtech the endpoint to push to.",
  limits:["Item mapping happens inside Grubtech, not in Supy. The Supy recipe code has to be typed into the 'external ID' field on each Grubtech item.","There is no Sync button and no way to re-fetch a day. If Supy is briefly unreachable when Grubtech pushes, that push is lost and cannot be recovered.","Delivery fees land on a dedicated 'delivery fee' recipe, which has to be created in Supy first or the fees have nowhere to go."],
  creds:[
    {r:"Branch ID (one per location)",i:"Get one per location from the client's Grubtech contact and pass them to the CSM."},
    {r:"Recipe codes entered in Grubtech",i:"For every recipe, the matching Supy recipe code goes into the 'external ID' field on the Grubtech item.",n:"This is done in Grubtech by the client or by Grubtech, not by you in Supy. Until it is done, nothing maps."},
    {r:"Delivery fee recipe created",i:"If the client charges delivery fees, ask the CSM to create a dedicated delivery fee recipe in Supy."}
  ]},

"IdealPOS":{type:"self",auth:"API (key + ID + secret)",
  note:"Ask the client to get all three from their IdealPOS contact.",
  limits:["A refund comes through as a brand new transaction with no link back to the original sale, so you cannot match them up.","An open tab is dated when it is closed, not when it is opened. A tab opened last night and settled this morning counts as today's sale.","Wastage is its own transaction type and can never appear inside a sales order.","Timestamps come through in the restaurant's local time, not UTC. Do not convert them."],
  creds:[
    {r:"API Key",i:"Goes in Supy when you add Ideal POS."},
    {r:"Tenant ID",i:"Identifies the client's IdealPOS account."},
    {r:"Secret Key",i:"The third of the three values. All three are required."}
  ]},

"Lightspeed K-Series":{type:"self",auth:"API (direct login)",
  note:"The client uses the Lightspeed K-Series login they already have. There is nothing to request from Lightspeed.",
  limits:["Use a different login email for each restaurant or account. Reuse one email across two accounts and their menu item data gets mixed together.","If you are connecting branches across several tenants, set each tenant's sync time at least 30 minutes apart or the authentication fails.","Sales are not tracked for 'production instructions'. If the client uses those instead of real menu items, they have to be rebuilt as proper items first."],
  recon:"Reports > Shifts Report. Gross = Total Sales Incl. Tax. Net = Total Sales Excl. Tax.",
  creds:[
    {r:"Username",i:"The client enters this in Supy when adding Lightspeed K-Series.",n:"Check this email is used for this restaurant only and is not shared with another Lightspeed account."},
    {r:"Password",i:"The client enters this in Supy."},
    {r:"All 3 permissions granted",i:"When prompted, the client has to grant financial data, items, and orders.",n:"Miss any one of the three and the integration will not work. Two out of three is the same as zero."},
    {r:"Sync times staggered",i:"Only if there is more than one tenant. Space each tenant's sync time at least 30 minutes apart. Example: 02:00, 02:30, 03:00."},
    {r:"Production instructions converted",i:"Ask whether the client uses production instructions in place of menu items. If they do, those have to be rebuilt as real items before go-live."}
  ]},

"Lightspeed O-Series":{type:"self",auth:"OAuth (client logs in)",
  note:"This is the product that used to be called Kounta. The client signs in with their existing Lightspeed O-Series login and grants access to the right company.",
  limits:["On-screen modifiers are not tracked in sales data at all. Only 'options' are. This is a limit of the Lightspeed API, not something Supy can work around.","Any sale carrying an on-screen modifier arrives as INVALID_MODIFIER priced at 0.0. If the client uses on-screen modifiers, they must move them to options in the Lightspeed backoffice before go-live. This cannot be fixed retroactively, so past days stay broken forever."],
  recon:"Insights > Reports > Product Sales > Sales by Product. Product Name (a * means it is a modifier) = POS Item Name. Sales = Total Sales Incl. Tax.",
  creds:[
    {r:"Lightspeed O-Series email",i:"The client types this on the Lightspeed login page."},
    {r:"Lightspeed O-Series password",i:"The client types this on the same page."},
    {r:"Company selected and access granted",i:"The client picks the company, clicks Grant Access, and gets redirected back to Supy. If they have more than one company, make sure they pick the right one."},
    {r:"Modifier check: options vs on-screen",i:"Go through the client's menu and find anything using on-screen modifiers. Those have to be converted to options before go-live.",n:"Skip this and you get INVALID_MODIFIER entries at 0.0 that can never be recovered."}
  ]},

"Lightspeed X-Series":{type:"self",auth:"API (URL + login)",
  note:"The client uses the Lightspeed X-Series login they already have.",
  limits:["X-Series is built for retail, not table-service restaurants. If the client runs K-Series or O-Series at other sites, confirm which Lightspeed product each site actually uses before you start.","Discount and modifier handling is not documented for X-Series."],
  creds:[
    {r:"Store URL",i:"The client's own Lightspeed X-Series address.",ex:"yourstore.vendhq.com"},
    {r:"Username",i:"The client enters this in Supy."},
    {r:"Password",i:"The client enters this in Supy."},
    {r:"Right Lightspeed product confirmed",i:"Check site by site whether it runs K-Series, O-Series or X-Series. They are three different integrations and picking the wrong one wastes days."}
  ]},

"Linga POS":{type:"assist",auth:"API (Supy assists with mapping)",
  note:"The client asks their Linga POS contact for the Store ID and API Key. The CSM has to help with branch mapping.",
  limits:["Linga's own sales reports fold modifier returns into the parent item's total, while Supy records them per modifier. On any day with returns the two reports will differ. That is expected, not a bug, so do not raise it as an issue."],
  recon:"Reports > Sales. Download both the menu items report and the modifiers report, you need both. Sale Amount = Total Sales Excl. Tax. Quantity = Quantity Sold. Discount = Total Discount Value.",
  creds:[
    {r:"Store ID (for the first connection)",i:"Goes in Supy when you add Linga POS."},
    {r:"API Key",i:"Goes in Supy. The same key works for all of the client's stores, so you only need it once."},
    {r:"Store ID for each extra branch",i:"One Store ID per branch. The API Key does not change."},
    {r:"Branch details for the CSM",i:"For each branch, send the CSM: retailer ID, the Linga store name (used as the tenant name), the Linga store ID, the Supy branch name, and the date and time sales should start from."}
  ]},

"Revel":{type:"self",auth:"API (key + secret + domain)",

/* ═════════════════════════════════════════════════════════════════════
   HELPERS
   ═════════════════════════════════════════════════════════════════════ */
var MAX_CLIENTS = 100;

var $ = function(id){return document.getElementById(id);};
var key = function(c,p){return "posck:rec:"+String(c).trim().toLowerCase()+"::"+p;};
function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}
function nowISO(){ return new Date().toISOString(); }
function fmtDate(v){
  if(!v) return "";
  var d = new Date(v);
  if(isNaN(d.getTime())) return "";
  return d.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});
}
function daysSince(v){
  if(!v) return 0;
  var d = new Date(v).getTime();
  if(isNaN(d)) return 0;
  return Math.floor((Date.now() - d) / 86400000);
}
function daysUntilTarget(dateStr){
  if(!dateStr) return null;
  var d = new Date(dateStr + "T23:59:59").getTime();
  if(isNaN(d)) return null;
  return Math.ceil((d - Date.now()) / 86400000);
}
function relDays(v){
  if(!v) return "—";
  var n = daysSince(v);
  if(n <= 0) return "Today";
  if(n === 1) return "Yesterday";
  return n + " days ago";
}

/* ═════════════════════════════════════════════════════════════════════
   STORAGE
   Everything lives in this browser's localStorage. The functions are
   async on purpose: swapping localStorage for Supabase later means
   rewriting only the three bodies below, nothing else in this file.
   See SUPABASE.md in the repo for the table schema and the adapter.
   ═════════════════════════════════════════════════════════════════════ */
var mem = {};
var DB = {
  get: function(k){
    try{
      var v = localStorage.getItem(k);
      return Promise.resolve(v ? JSON.parse(v) : (mem[k] || null));
    }catch(e){ return Promise.resolve(mem[k] || null); }
  },
  set: function(k,v){
    mem[k] = v;
    try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){}
    return Promise.resolve();
  },
  del: function(k){
    delete mem[k];
    try{ localStorage.removeItem(k); }catch(e){}
    return Promise.resolve();
  }
};

/* ═════════════════════════════════════════════════════════════════════
   STATE
   cur   : the record being edited, or null
   index : denormalised summary of every saved client, for the tracker
   ═════════════════════════════════════════════════════════════════════ */
var cur = null;
var index = [];
var page = "checklist";
var openNotes = {};                       // itemId -> true while the editor is showing
var tracker = { q:"", filter:null, sort:"health", dir:1 };
var combo = { open:false, hi:-1, matches:[] };

function blankRecord(name,pos){
  return {
    client:name, pos:pos,
    createdAt:nowISO(), updatedAt:nowISO(),
    goLiveTarget:"", specialNote:"",
    items:{},          // id -> {done:true, doneAt:ISO, note:"..."}
    collapsed:{}
  };
}
function itemState(id){
  return (cur && cur.items && cur.items[id]) || null;
}
function isDone(id){
  var s = itemState(id);
  return !!(s && s.done);
}

function toast(msg){
  var t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(function(){ t.classList.remove("show"); }, 1800);
}

/* ═════════════════════════════════════════════════════════════════════
   PROGRESS + HEALTH
   ═════════════════════════════════════════════════════════════════════ */
function totals(phases, items){
  var done = 0, all = 0;
  phases.forEach(function(ph){
    ph.items.forEach(function(it){
      all++;
      if(items && items[it.id] && items[it.id].done) done++;
    });
  });
  return { done:done, all:all, pct: all ? Math.round(done/all*100) : 0 };
}

/* Health thresholds, all in one place so they are easy to tune.
   critical  : past the go-live target, or 7+ days quiet under 80%,
               or 30+ days since kickoff under 70%
   attention : target within 7 days under 70%, or 5+ days quiet under 60%,
               or 21+ days in under 70%, or 14+ days in under 50%
   complete  : every item checked
   ok        : everything else                                          */
function healthOf(row){
  if(row.all > 0 && row.done === row.all) return "complete";
  var pct = row.pct;
  var quiet = daysSince(row.updatedAt || row.createdAt);
  var age = daysSince(row.createdAt);
  var toTarget = daysUntilTarget(row.goLiveTarget);

  if(toTarget !== null && toTarget < 0) return "critical";
  if(quiet >= 7 && pct < 80) return "critical";
  if(age >= 30 && pct < 70) return "critical";

  if(toTarget !== null && toTarget <= 7 && pct < 70) return "attention";
  if(quiet >= 5 && pct < 60) return "attention";
  if(age >= 21 && pct < 70) return "attention";
  if(age >= 14 && pct < 50) return "attention";

  return "ok";
}
var HEALTH_META = {
  critical:{label:"Critical", desc:"Past target date, quiet 7+ days under 80%, or 30+ days in under 70%"},
  attention:{label:"Needs attention", desc:"Target close with low progress, quiet 5+ days, or slow since kickoff"},
  ok:{label:"On track", desc:"Moving along inside the expected timeline"},
  complete:{label:"Complete", desc:"Every checklist item done"}
};
function healthReason(row){
  var h = healthOf(row);
  if(h === "complete") return "All items complete";
  var toTarget = daysUntilTarget(row.goLiveTarget);
  var quiet = daysSince(row.updatedAt || row.createdAt);
  var age = daysSince(row.createdAt);
  if(toTarget !== null && toTarget < 0) return Math.abs(toTarget) + " days past go-live target";
  if(quiet >= 7 && row.pct < 80) return "No activity for " + quiet + " days at " + row.pct + "%";
  if(age >= 30 && row.pct < 70) return age + " days since kickoff at " + row.pct + "%";
  if(toTarget !== null && toTarget <= 7 && row.pct < 70) return "Target in " + toTarget + " days at " + row.pct + "%";
  if(quiet >= 5 && row.pct < 60) return "No activity for " + quiet + " days at " + row.pct + "%";
  if(age >= 21 && row.pct < 70) return age + " days since kickoff at " + row.pct + "%";
  if(age >= 14 && row.pct < 50) return age + " days since kickoff at " + row.pct + "%";
  return "On schedule";
}
function barColor(h){
  return h === "critical" ? "var(--tx-error)" :
         h === "attention" ? "var(--orange)" :
         h === "complete" ? "var(--action)" : "var(--green)";
}

/* ═════════════════════════════════════════════════════════════════════
   CHECKLIST RENDER
   ═════════════════════════════════════════════════════════════════════ */
function render(){
  if(page === "tracker"){ renderTracker(); return; }

  $("checklistPage").style.display = "";
  $("trackerPage").style.display = "none";

  var main = $("main"), side = $("side");

  if(!cur){
    main.innerHTML = '<div class="empty"><h3>No checklist loaded</h3>' +
      '<p>Type a client name (start typing to search the ones you already have), pick their POS provider, and hit Load checklist.</p></div>';
    side.innerHTML = "";
    return;
  }

  var p = P[cur.pos];
  var phases = buildPhases(cur.pos);
  var t = totals(phases, cur.items);

  var tagCls = p.type === "self" ? "tag-self" : p.type === "assist" ? "tag-assist" : "tag-tech";
  var tagTxt = p.type === "self" ? "Self-service" : p.type === "assist" ? "Assisted setup" : "Engineering-handled";

  var h = "";

  h += '<div class="toolbar">' +
       '<button class="btn btn-ghost" id="expandAll">Expand all</button>' +
       '<button class="btn btn-ghost" id="collapseAll">Collapse all</button>' +
       '<button class="btn btn-ghost" id="copyBtn">Copy as text</button>' +
       '<button class="btn btn-ghost" id="printBtn">Print</button>' +
       '<button class="btn btn-danger" id="resetBtn">Reset</button></div>';

  h += '<div class="pbanner"><div class="pbanner-t">' + esc(cur.pos) +
       '<span class="pbanner-tag ' + tagCls + '">' + tagTxt + '</span>' +
       '<span class="pbanner-tag" style="background:rgba(255,255,255,.15);color:#fff">' + esc(p.auth) + '</span></div>';
  h += '<div class="pbanner-n">' + esc(p.note) + '</div>';
  if(p.recon) h += '<div class="pbanner-recon">Reconcile against: ' + esc(p.recon) + '</div>';
  h += '</div>';

  h += '<div class="prog-wrap"><div class="prog-top">' +
       '<div class="prog-title">' + esc(cur.client) + ' <span class="sub">on ' + esc(cur.pos) + '</span></div>' +
       '<div class="prog-num">' + t.done + ' of ' + t.all + ' complete &middot; ' + t.pct + '%</div></div>' +
       '<div class="bar"><div class="bar-fill' + (t.pct === 100 ? " done" : "") + '" style="width:' + t.pct + '%"></div></div>';

  var gateIdx = [0,4,6,8];
  var openGates = [];
  gateIdx.forEach(function(gi){
    var ph = phases[gi];
    var incomplete = ph.items.some(function(it){ return !isDone(it.id); });
    if(incomplete) openGates.push(ph.t);
  });
  if(t.pct === 100){
    h += '<div class="gate-ok">All gates passed. This implementation is fully documented and signed off.</div>';
  }else if(openGates.length){
    h += '<div class="gate-warn"><b>Gates still open, blocking go-live:</b> ' + openGates.map(esc).join(" &middot; ") + '</div>';
  }
  h += '</div>';

  phases.forEach(function(ph,pi){
    var dn = ph.items.filter(function(it){ return isDone(it.id); }).length;
    var complete = ph.items.length > 0 && dn === ph.items.length;
    var closed = !!cur.collapsed[pi];
    h += '<div class="phase' + (closed ? " closed" : "") + (complete ? " complete" : "") + '">';
    h += '<div class="phase-hd" data-toggle="' + pi + '">' +
         '<div class="phase-n">' + esc(ph.n) + '</div>' +
         '<div class="phase-t">' + esc(ph.t) + (ph.gate ? '<span class="gate">' + esc(ph.gate) + '</span>' : '') + '</div>' +
         '<div class="phase-c">' + dn + '/' + ph.items.length + '</div>' +
         '<div class="phase-ar">&#9660;</div></div>';
    h += '<div class="phase-body">';
    ph.items.forEach(function(it){ h += itemHTML(it); });
    h += '</div></div>';
  });

  main.innerHTML = h;
  side.innerHTML = sidebarHTML(p, phases, t);
  wire(phases, p);
}

function itemHTML(it){
  var st = itemState(it.id) || {};
  var on = !!st.done;
  var ow = it.o === "client" ? ["ow-client","Client"] :
           it.o === "csm" ? ["ow-csm","CSM"] :
           it.o === "eng" ? ["ow-eng","Engineering"] : ["ow-me","Me"];

  var h = '<div class="item' + (on ? " checked" : "") + '">';
  h += '<div class="cb' + (on ? " on" : "") + '" data-check="' + esc(it.id) + '"></div>';
  h += '<div class="item-body">';
  h += '<div class="item-req">' + it.r + '<span class="owner ' + ow[0] + '">' + ow[1] + '</span></div>';
  h += '<div class="item-ins">' + it.i + '</div>';
  if(it.ex) h += '<div class="item-ex">Example: ' + esc(it.ex) + '</div>';
  if(it.n) h += '<div class="item-note' + (it.nt === "info" ? " info" : "") + '"><span>' + esc(it.n) + '</span></div>';

  h += '<div class="item-meta">';
  if(on && st.doneAt) h += '<span class="done-at">Completed ' + esc(fmtDate(st.doneAt)) + '</span>';
  h += '<button class="note-btn" data-note="' + esc(it.id) + '">' +
       (openNotes[it.id] ? "Hide note" : (st.note ? "Edit note" : "+ Add note")) + '</button>';
  h += '</div>';

  if(openNotes[it.id]){
    h += '<div class="note-box"><textarea data-noteinput="' + esc(it.id) + '" ' +
         'placeholder="Context worth remembering. Example: waiting on client since Aug 12. Or: API key expired, re-requested.">' +
         esc(st.note || "") + '</textarea></div>';
  }else if(st.note){
    h += '<div class="note-saved">' + esc(st.note) + '</div>';
  }

  h += '</div></div>';
  return h;
}

function sidebarHTML(p, phases, t){
  var tagCls = p.type === "self" ? "tag-self" : p.type === "assist" ? "tag-assist" : "tag-tech";
  var tagTxt = p.type === "self" ? "Self-service" : p.type === "assist" ? "Assisted setup" : "Engineering-handled";
  var credDone = p.creds.filter(function(_,i){ return isDone("cred-" + i); }).length;
  var row = {
    pct:t.pct, done:t.done, all:t.all,
    createdAt:cur.createdAt, updatedAt:cur.updatedAt, goLiveTarget:cur.goLiveTarget
  };
  var hh = healthOf(row);

  var h = "";

  /* credentials */
  h += '<div class="side-card">';
  h += '<div class="side-hd"><h3>Credentials to collect</h3>' +
       '<div class="side-sub">' + esc(cur.pos) + ' &middot; ' + credDone + ' of ' + p.creds.length + ' done</div></div>';
  h += '<div class="side-body">';
  h += '<div style="margin-bottom:12px"><span class="side-tag ' + tagCls + '">' + tagTxt + '</span> ' +
       '<span class="side-tag" style="background:var(--bg-neutral);color:var(--tx-neutral)">' + esc(p.auth) + '</span></div>';
  p.creds.forEach(function(c,i){
    var id = "cred-" + i, on = isDone(id);
    h += '<div class="side-cred' + (on ? " on" : "") + '">';
    h += '<div class="cb sm' + (on ? " on" : "") + '" data-check="' + id + '"></div>';
    h += '<div class="side-cred-b"><div class="side-cred-n">' + esc(c.r) + '</div>';
    h += '<div class="side-cred-i">' + esc(c.i) + '</div>';
    if(c.ex) h += '<div class="side-cred-ex">' + esc(c.ex) + '</div>';
    h += '</div></div>';
  });
  h += '<div class="side-cred-i" style="margin-top:11px;color:var(--tx-error)">Never collect credentials over email or chat. ' +
       'Type them into the Retailer Portal, or use the secure request process.</div>';
  h += '</div></div>';

  /* go-live target + special case */
  h += '<div class="side-card"><div class="side-body">';
  h += '<div class="side-fld" style="margin-bottom:16px"><label>Go-live target date</label>' +
       '<input type="date" id="sideTarget" value="' + esc(cur.goLiveTarget || "") + '"/>';
  var toTarget = daysUntilTarget(cur.goLiveTarget);
  if(toTarget !== null){
    h += '<div class="hint" style="color:' + (toTarget < 0 ? "var(--tx-error)" : toTarget <= 7 ? "var(--tx-orange)" : "var(--mid)") + '">' +
      (toTarget < 0 ? Math.abs(toTarget) + " days past target" :
       toTarget === 0 ? "Target is today" : toTarget + " days to target") +
      ' &middot; ' + t.pct + '% complete &middot; ' + esc(HEALTH_META[hh].label) + '</div>';
  }else{
    h += '<div class="hint">Set a date and this client starts showing a health status on the Client Tracker.</div>';
  }
  h += '</div>';

  h += '<div class="side-fld"><label>Special case note</label>' +
       '<textarea id="sideNote" rows="4" placeholder="Example: client&#39;s own IT team is doing the integration, we only validate. Or: they will not share the API key, so credentials go through their CTO."></textarea>' +
       '<div class="hint">Use this when the client wants to run the integration themselves, or has unusual credential requirements. It is included in Copy as text.</div></div>';
  h += '</div></div>';

  /* known limitations */
  h += '<div class="side-card">';
  h += '<div class="side-hd" style="background:var(--purple)"><h3>Known limitations</h3>' +
       '<div class="side-sub">Tell the client these before go-live, not after</div></div>';
  h += '<div class="side-body">';
  if(p.limits && p.limits.length){
    p.limits.forEach(function(l){ h += '<div class="side-lim">' + esc(l) + '</div>'; });
  }else{
    h += '<div class="side-none">No limitations recorded for ' + esc(cur.pos) + '. That means none are documented, not that none exist. If you hit one, add it to the playbook.</div>';
  }
  h += '</div></div>';

  return h;
}

/* ═════════════════════════════════════════════════════════════════════
   WIRING
   ═════════════════════════════════════════════════════════════════════ */
function each(sel, fn){
  Array.prototype.forEach.call(document.querySelectorAll(sel), fn);
}

function wire(phases, p){
  /* checkboxes: one handler covers both the checklist and the sidebar,
     so ticking a credential in either place updates the other */
  each("[data-check]", function(el){
    el.onclick = function(){
      var id = el.getAttribute("data-check");
      var st = cur.items[id];
      if(st && st.done){
        st.done = false;
        delete st.doneAt;
        if(!st.note) delete cur.items[id];
      }else{
        cur.items[id] = cur.items[id] || {};
        cur.items[id].done = true;
        cur.items[id].doneAt = nowISO();
      }
      save().then(render);
    };
  });

  each(".phase-hd", function(el){
    el.onclick = function(){
      var pi = el.getAttribute("data-toggle");
      if(cur.collapsed[pi]) delete cur.collapsed[pi];
      else cur.collapsed[pi] = true;
      save().then(render);
    };
  });

  each("[data-note]", function(el){
    el.onclick = function(){
      var id = el.getAttribute("data-note");
      if(openNotes[id]) delete openNotes[id];
      else openNotes[id] = true;
      render();
      var ta = document.querySelector('[data-noteinput="' + id + '"]');
      if(ta){ ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
    };
  });

  /* typing in a note never re-renders, or the caret would jump */
  each("[data-noteinput]", function(el){
    el.oninput = function(){
      var id = el.getAttribute("data-noteinput");
      cur.items[id] = cur.items[id] || {};
      cur.items[id].note = el.value;
      if(!el.value && !cur.items[id].done) delete cur.items[id];
      debounceSave();
    };
  });

  var target = $("sideTarget");
  if(target) target.onchange = function(){
    cur.goLiveTarget = target.value;
    save().then(render);
  };

  var sNote = $("sideNote");
  if(sNote){
    sNote.value = cur.specialNote || "";
    sNote.oninput = function(){ cur.specialNote = sNote.value; debounceSave(); };
  }

  $("expandAll").onclick = function(){ cur.collapsed = {}; save().then(render); };
  $("collapseAll").onclick = function(){
    cur.collapsed = {};
    phases.forEach(function(_,i){ cur.collapsed[i] = true; });
    save().then(render);
  };
  $("printBtn").onclick = function(){ window.print(); };
  $("resetBtn").onclick = function(){ openReset(); };
  $("copyBtn").onclick = function(){ copyAsText(phases, p); };
}

function debounceSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(function(){ save(); }, 600);
}

/* ═════════════════════════════════════════════════════════════════════
   COPY AS TEXT
   ═════════════════════════════════════════════════════════════════════ */
function copyAsText(phases, p){
  var t = totals(phases, cur.items);
  var out = cur.client + " — " + cur.pos + "\n" + "=".repeat(60) + "\n";
  out += "Progress: " + t.done + " of " + t.all + " (" + t.pct + "%)\n";
  out += "Integration type: " + (p.type === "self" ? "Self-service" : p.type === "assist" ? "Assisted setup" : "Engineering-handled") + "\n";
  out += "Kickoff: " + (fmtDate(cur.createdAt) || "—") + "\n";
  out += "Last activity: " + (fmtDate(cur.updatedAt) || "—") + "\n";
  out += "Go-live target: " + (cur.goLiveTarget ? fmtDate(cur.goLiveTarget) : "not set") + "\n";
  if(cur.specialNote && cur.specialNote.trim()){
    out += "\nSPECIAL CASE NOTE\n" + cur.specialNote.trim() + "\n";
  }
  out += "\n";

  phases.forEach(function(ph){
    out += "[" + ph.n + "] " + ph.t.toUpperCase() + (ph.gate ? "  (GATE: " + ph.gate + ")" : "") + "\n";
    ph.items.forEach(function(it){
      var st = cur.items[it.id] || {};
      var mark = st.done ? "[x]" : "[ ]";
      var label = (it.plain || it.r).replace(/<[^>]+>/g, "");
      out += "  " + mark + " " + label;
      if(st.done && st.doneAt) out += "   (completed " + fmtDate(st.doneAt) + ")";
      out += "\n";
      if(st.note && st.note.trim()){
        st.note.trim().split("\n").forEach(function(line){ out += "        note: " + line + "\n"; });
      }
    });
    out += "\n";
  });

  if(p.limits && p.limits.length){
    out += "KNOWN LIMITATIONS — " + cur.pos + "\n";
    p.limits.forEach(function(l){ out += "  - " + l + "\n"; });
    out += "\n";
  }

  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(out).then(
      function(){ toast("Copied to clipboard"); },
      function(){ toast("Could not copy — check browser permissions"); }
    );
  }else{
    toast("Clipboard not available in this browser");
  }
}

/* ═════════════════════════════════════════════════════════════════════
   RESET MODAL
   ═════════════════════════════════════════════════════════════════════ */
function openReset(){
  $("resetTxt").textContent =
    "This will uncheck all items and clear all notes for " + cur.client + ". This action cannot be undone.";
  $("resetMask").classList.add("open");
}
function closeReset(){ $("resetMask").classList.remove("open"); }

/* ═════════════════════════════════════════════════════════════════════
   CLIENT TRACKER
   ═════════════════════════════════════════════════════════════════════ */
function trackerRows(){
  return index.map(function(x){
    var row = {
      client:x.client, pos:x.pos, pct:x.pct || 0,
      done:x.done || 0, all:x.all || 0,
      createdAt:x.createdAt, updatedAt:x.updatedAt, goLiveTarget:x.goLiveTarget || ""
    };
    row.health = healthOf(row);
    row.reason = healthReason(row);
    return row;
  });
}
var HORDER = { critical:0, attention:1, ok:2, complete:3 };

function renderTracker(){
  $("checklistPage").style.display = "none";
  $("trackerPage").style.display = "";

  var rows = trackerRows();
  var counts = { critical:0, attention:0, ok:0, complete:0 };
  rows.forEach(function(r){ counts[r.health]++; });

  var q = tracker.q.trim().toLowerCase();
  var shown = rows.filter(function(r){
    if(tracker.filter && r.health !== tracker.filter) return false;
    if(q && (r.client + " " + r.pos).toLowerCase().indexOf(q) === -1) return false;
    return true;
  });

  shown.sort(function(a,b){
    var s = tracker.sort, av, bv;
    if(s === "health"){ av = HORDER[a.health]; bv = HORDER[b.health]; }
    else if(s === "pct"){ av = a.pct; bv = b.pct; }
    else if(s === "createdAt" || s === "updatedAt"){
      av = new Date(a[s] || 0).getTime(); bv = new Date(b[s] || 0).getTime();
    }
    else if(s === "goLiveTarget"){
      av = a.goLiveTarget ? new Date(a.goLiveTarget).getTime() : 8.64e15;
      bv = b.goLiveTarget ? new Date(b.goLiveTarget).getTime() : 8.64e15;
    }
    else { av = String(a[s] || "").toLowerCase(); bv = String(b[s] || "").toLowerCase(); }
    if(av < bv) return -1 * tracker.dir;
    if(av > bv) return 1 * tracker.dir;
    return a.client.localeCompare(b.client);
  });

  var h = "";

  h += '<div class="hcards">';
  ["critical","attention","ok","complete"].forEach(function(k){
    h += '<div class="hcard ' + k + (tracker.filter === k ? " on" : "") + '" data-hfilter="' + k + '">' +
         '<div class="hcard-n">' + counts[k] + '</div>' +
         '<div class="hcard-t">' + esc(HEALTH_META[k].label) + '</div>' +
         '<div class="hcard-d">' + esc(HEALTH_META[k].desc) + '</div></div>';
  });
  h += '</div>';

  h += '<div class="tbar">' +
       '<input id="tq" type="text" placeholder="Search by client name or POS provider" value="' + esc(tracker.q) + '"/>';
  if(tracker.filter){
    h += '<button class="btn btn-ghost" id="clearFilter">Clear ' + esc(HEALTH_META[tracker.filter].label) + ' filter</button>';
  }
  h += '<span class="filter-note">' + shown.length + ' of ' + rows.length + ' clients</span></div>';

  if(!rows.length){
    h += '<div class="empty"><h3>No clients saved yet</h3>' +
         '<p>Load a checklist on the Checklist tab and it will show up here.</p></div>';
    $("trackerPage").innerHTML = h;
    wireTracker();
    return;
  }

  var cols = [
    ["client","Client"], ["pos","POS"], ["pct","Progress"], ["health","Health"],
    ["createdAt","Started"], ["updatedAt","Last activity"], ["goLiveTarget","Go-live target"]
  ];
  h += '<div class="tbl-wrap"><table class="tbl"><thead><tr>';
  cols.forEach(function(c){
    var active = tracker.sort === c[0];
    h += '<th data-sort="' + c[0] + '">' + esc(c[1]) +
         '<span class="ar">' + (active ? (tracker.dir === 1 ? "▲" : "▼") : "▵") + '</span></th>';
  });
  h += '</tr></thead><tbody>';

  if(!shown.length){
    h += '<tr><td colspan="7" class="td-dim" style="padding:22px 14px">Nothing matches that search and filter.</td></tr>';
  }
  shown.forEach(function(r){
    var toTarget = daysUntilTarget(r.goLiveTarget);
    h += '<tr data-open="' + esc(r.client) + '" data-openpos="' + esc(r.pos) + '">';
    h += '<td><div class="td-client">' + esc(r.client) + '</div>' +
         '<div class="td-dim" style="font-size:11.5px">' + esc(r.reason) + '</div></td>';
    h += '<td class="td-pos">' + esc(r.pos) + '</td>';
    h += '<td><div class="td-pct">' + r.pct + '%</div>' +
         '<div class="mini-bar"><div class="mini-fill" style="width:' + r.pct + '%;background:' + barColor(r.health) + '"></div></div></td>';
    h += '<td><span class="hbadge hb-' + r.health + '">' + esc(HEALTH_META[r.health].label) + '</span></td>';
    h += '<td class="td-dim">' + esc(fmtDate(r.createdAt) || "—") + '</td>';
    h += '<td class="td-dim">' + esc(relDays(r.updatedAt || r.createdAt)) + '</td>';
    h += '<td class="' + (toTarget !== null && toTarget < 0 && r.health !== "complete" ? "td-late" : "td-dim") + '">' +
         (r.goLiveTarget ? esc(fmtDate(r.goLiveTarget)) : "Not set") + '</td>';
    h += '</tr>';
  });
  h += '</tbody></table></div>';

  $("trackerPage").innerHTML = h;
  wireTracker();
}

function wireTracker(){
  each("[data-hfilter]", function(el){
    el.onclick = function(){
      var k = el.getAttribute("data-hfilter");
      tracker.filter = (tracker.filter === k) ? null : k;
      renderTracker();
    };
  });
  var cf = $("clearFilter");
  if(cf) cf.onclick = function(){ tracker.filter = null; renderTracker(); };

  var tq = $("tq");
  if(tq){
    tq.oninput = function(){
      tracker.q = tq.value;
      var pos = tq.selectionStart;
      renderTracker();
      var again = $("tq");
      if(again){ again.focus(); again.setSelectionRange(pos, pos); }
    };
  }

  each("[data-sort]", function(el){
    el.onclick = function(){
      var s = el.getAttribute("data-sort");
      if(tracker.sort === s) tracker.dir = -tracker.dir;
      else { tracker.sort = s; tracker.dir = 1; }
      renderTracker();
    };
  });

  each("[data-open]", function(el){
    el.onclick = function(){
      var c = el.getAttribute("data-open"), pos = el.getAttribute("data-openpos");
      $("clientName").value = c;
      $("posSelect").value = pos;
      goPage("checklist");
      load();
    };
  });
}

/* ═════════════════════════════════════════════════════════════════════
   PERSISTENCE
   ═════════════════════════════════════════════════════════════════════ */
function save(){
  if(!cur) return Promise.resolve();
  cur.updatedAt = nowISO();
  if(!cur.createdAt) cur.createdAt = cur.updatedAt;

  var k = key(cur.client, cur.pos);
  var phases = buildPhases(cur.pos);
  var t = totals(phases, cur.items);

  var rest = index.filter(function(x){ return key(x.client, x.pos) !== k; });
  rest.unshift({
    client:cur.client, pos:cur.pos,
    pct:t.pct, done:t.done, all:t.all,
    createdAt:cur.createdAt, updatedAt:cur.updatedAt,
    goLiveTarget:cur.goLiveTarget || ""
  });
  index = rest.slice(0, MAX_CLIENTS);

  return DB.set(k, cur).then(function(){
    return DB.set("posck:index", index);
  }).then(function(){
    renderChips();
  });
}

function renderChips(){
  var w = $("savedWrap"), c = $("chips");
  if(!index.length){ w.style.display = "none"; return; }
  w.style.display = "block";
  c.innerHTML = index.map(function(x,i){
    var on = cur && key(cur.client, cur.pos) === key(x.client, x.pos);
    return '<div class="chip' + (on ? " on" : "") + '" data-i="' + i + '">' + esc(x.client) +
           ' <span class="pct">' + (x.pct || 0) + '%</span></div>';
  }).join("");
  each("#chips .chip", function(el){
    el.onclick = function(){
      var x = index[+el.getAttribute("data-i")];
      $("clientName").value = x.client;
      $("posSelect").value = x.pos;
      load();
    };
  });
}

function load(){
  var name = $("clientName").value.trim();
  var pos = $("posSelect").value;
  if(!name){ toast("Enter a client name"); return Promise.resolve(); }
  if(!pos){ toast("Select a POS provider"); return Promise.resolve(); }
  if(!P[pos]){ toast("Unknown POS provider"); return Promise.resolve(); }

  closeCombo();
  openNotes = {};

  return DB.get(key(name,pos)).then(function(saved){
    cur = saved || blankRecord(name,pos);
    cur.client = name;
    cur.pos = pos;
    cur.items = cur.items || {};
    cur.collapsed = cur.collapsed || {};
    cur.specialNote = cur.specialNote || "";
    cur.goLiveTarget = cur.goLiveTarget || "";
    cur.createdAt = cur.createdAt || nowISO();
    goPage("checklist");
    render();
    renderChips();
    return save();
  });
}

/* ═════════════════════════════════════════════════════════════════════
   SEARCHABLE CLIENT DROPDOWN
   ═════════════════════════════════════════════════════════════════════ */
function comboMatches(){
  var q = $("clientName").value.trim().toLowerCase();
  if(!q) return index.slice(0, 8);
  return index.filter(function(x){
    return (x.client + " " + x.pos).toLowerCase().indexOf(q) !== -1;
  }).slice(0, 8);
}
function openCombo(){
  if(!index.length) return;
  combo.matches = comboMatches();
  combo.hi = -1;
  var list = $("comboList");
  if(!combo.matches.length){
    list.innerHTML = '<div class="combo-empty">No saved clients match. Press Enter to create a new one.</div>';
  }else{
    list.innerHTML = combo.matches.map(function(x,i){
      return '<div class="combo-opt" data-ci="' + i + '">' +
             '<div><div class="combo-opt-n">' + esc(x.client) + '</div>' +
             '<div class="combo-opt-s">' + esc(x.pos) + '</div></div>' +
             '<div class="combo-opt-p">' + (x.pct || 0) + '%</div></div>';
    }).join("");
    each("#comboList .combo-opt", function(el){
      el.onmousedown = function(ev){
        ev.preventDefault();
        pickCombo(+el.getAttribute("data-ci"));
      };
    });
  }
  list.classList.add("open");
  combo.open = true;
}
function closeCombo(){
  $("comboList").classList.remove("open");
  combo.open = false;
  combo.hi = -1;
}
function highlight(n){
  combo.hi = n;
  each("#comboList .combo-opt", function(el,i){
    if(i === n) el.classList.add("hi"); else el.classList.remove("hi");
  });
  var el = document.querySelector('#comboList .combo-opt.hi');
  if(el && el.scrollIntoView) el.scrollIntoView({block:"nearest"});
}
function pickCombo(i){
  var x = combo.matches[i];
  if(!x) return;
  $("clientName").value = x.client;
  $("posSelect").value = x.pos;
  closeCombo();
  load();
}

/* ═════════════════════════════════════════════════════════════════════
   NAV
   ═════════════════════════════════════════════════════════════════════ */
function goPage(p){
  page = p;
  $("tabChecklist").classList.toggle("on", p === "checklist");
  $("tabTracker").classList.toggle("on", p === "tracker");
  if(location.hash !== (p === "tracker" ? "#tracker" : "#checklist")){
    try{ history.replaceState(null, "", p === "tracker" ? "#tracker" : "#checklist"); }catch(e){}
  }
  render();
}

/* ═════════════════════════════════════════════════════════════════════
   INIT
   ═════════════════════════════════════════════════════════════════════ */
(function init(){
  var sel = $("posSelect");
  Object.keys(P).sort().forEach(function(k){
    var o = document.createElement("option");
    o.value = k; o.textContent = k;
    sel.appendChild(o);
  });

  $("loadBtn").onclick = function(){ load(); };
  $("tabChecklist").onclick = function(){ goPage("checklist"); };
  $("tabTracker").onclick = function(){ goPage("tracker"); };
  $("resetCancel").onclick = closeReset;
  $("resetMask").onclick = function(ev){ if(ev.target === $("resetMask")) closeReset(); };
  $("resetGo").onclick = function(){
    if(!cur) return closeReset();
    cur.items = {};
    openNotes = {};
    closeReset();
    save().then(render);
    toast("Checklist reset for " + cur.client);
  };
  document.addEventListener("keydown", function(ev){
    if(ev.key === "Escape" && $("resetMask").classList.contains("open")) closeReset();
  });

  var ci = $("clientName");
  ci.oninput = function(){ openCombo(); };
  ci.onfocus = function(){ openCombo(); };
  ci.onkeydown = function(ev){
    if(!combo.open){
      if(ev.key === "Enter"){ ev.preventDefault(); load(); }
      return;
    }
    if(ev.key === "ArrowDown"){
      ev.preventDefault();
      if(combo.matches.length) highlight((combo.hi + 1) % combo.matches.length);
    }else if(ev.key === "ArrowUp"){
      ev.preventDefault();
      if(combo.matches.length) highlight((combo.hi - 1 + combo.matches.length) % combo.matches.length);
    }else if(ev.key === "Enter"){
      ev.preventDefault();
      if(combo.hi >= 0) pickCombo(combo.hi);
      else { closeCombo(); load(); }
    }else if(ev.key === "Escape"){
      closeCombo();
    }
  };
  document.addEventListener("click", function(ev){
    if(!ev.target.closest || !ev.target.closest(".combo")) closeCombo();
  });

  window.addEventListener("hashchange", function(){
    goPage(location.hash === "#tracker" ? "tracker" : "checklist");
  });

  DB.get("posck:index").then(function(ix){
    if(ix && Array.isArray(ix)) index = ix;
    renderChips();
    goPage(location.hash === "#tracker" ? "tracker" : "checklist");
  });
})();

})();
</script>
</body>
</html>
